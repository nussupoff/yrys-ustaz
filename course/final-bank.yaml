  - id: "Q-L05-04"
    lesson_id: "L05"
    track: "foundation"
    type: "artifact_analysis"
    difficulty: "easy"
    learning_goal_ru: "Проанализировать собственный артефакт «обезличенный учебный пример» по доказательствам."
    learning_goal_kk: "Өзінің «иесіздендірілген оқу мысалы» артефактісін дәлелдер бойынша талдау."
    prompt_ru: "Приложите или откройте собственный артефакт «обезличенный учебный пример». Укажите два конкретных фрагмента, подтверждающих, что персональные данные удалены или заменены нейтральными метками. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «иесіздендірілген оқу мысалы» артефактіңізді тіркеңіз немесе ашыңыз. дербес деректер жойылған немесе бейтарап белгілермен ауыстырылған екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
    rubric_ru:
      - "0–2: представлены два конкретных доказательства из собственной работы, а не общие утверждения."
      - "0–2: доказательства действительно подтверждают критерий: персональные данные удалены или заменены нейтральными метками."
      - "0–2: предложенное улучшение связано с обнаруженной проблемой."
      - "0–2: приложено проверяемое доказательство изменения — до/после, таймкод, URL, скриншот или журнал теста."
      - "0–2: объяснение не содержит персональных данных учеников и позволяет повторить проверку."
    rubric_kk:
      - "0–2: жалпы тұжырым емес, өз жұмысынан екі нақты дәлел берілген."
      - "0–2: дәлелдер мына критерийді шынымен растайды: дербес деректер жойылған немесе бейтарап белгілермен ауыстырылған."
      - "0–2: ұсынылған жақсарту анықталған мәселемен байланысты."
      - "0–2: өзгерістің тексерілетін дәлелі тіркелген — дейін/кейін, таймкод, URL, скриншот немесе тест журналы."
