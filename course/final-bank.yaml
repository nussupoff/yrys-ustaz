    prompt_ru: "Приложите или откройте собственный артефакт «учебный постер». Укажите два конкретных фрагмента, подтверждающих, что главная мысль считывается быстро, детали поддерживают её. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
