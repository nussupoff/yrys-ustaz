questions:
  - id: "Q-L01-01"
    lesson_id: "L01"
    track: "foundation"
    type: "scenario_best_next_step"
    difficulty: "easy"
    learning_goal_ru: "Сформулировать задачу для ии-помощника и проверить полученный результат."
    learning_goal_kk: "Жи-көмекшіге тапсырманы тұжырымдап, алынған нәтижені тексеру."
    prompt_ru: "Учитель готовит материал для {grade} по предмету «{subject}». Нужно сформулировать задачу для ИИ-помощника и проверить полученный результат; ограничение: {constraint}. Какой следующий шаг наиболее обоснован?"
    prompt_kk: "Мұғалім {grade} үшін «{subject}» пәнінен материал дайындап жатыр. Міндет: ЖИ-көмекшіге тапсырманы тұжырымдап, алынған нәтижені тексеру; шектеу: {constraint}. Келесі қадамдардың қайсысы ең негізді?"
    options_ru:
      - "Сразу опубликовать первый результат ИИ без проверки."
      - "Уточнить цель и ограничения, получить черновик, затем проверить, что ответ соответствует педагогической цели и может быть проверен, и сохранить доказательство проверки."
      - "Попросить ИИ «сделать лучше», не уточняя, что именно должно измениться."
      - "Добавить реальные персональные данные учеников, чтобы ответ выглядел конкретнее."
    options_kk:
      - "ЖИ-дің алғашқы нәтижесін тексермей бірден жариялау."
      - "Мақсат пен шектеулерді нақтылап, нобай алу, содан кейін жауап педагогикалық мақсатқа сәйкес және тексеруге болады екенін тексеріп, тексеру дәлелін сақтау."
      - "Нені өзгерту керегін нақтыламай, ЖИ-ден «жақсырақ жасауды» сұрау."
      - "Жауап нақты көрінуі үшін оқушылардың шынайы дербес деректерін қосу."
    correct_answer: "B"
    rationale_ru: "Вариант B связывает генерацию с целью, ограничениями и проверяемым критерием. Остальные варианты исключают проверку, дают неопределённую команду или нарушают безопасность."
    rationale_kk: "B нұсқасы генерацияны мақсатпен, шектеулермен және тексерілетін критериймен байланыстырады. Қалған нұсқалар тексеруді алып тастайды, анық емес бұйрық береді немесе қауіпсіздікті бұзады."
    randomization:
      shuffle_options: true
      parameter_slots:
        - name: "grade"
          values_ru:
            - "2 класс"
            - "5 класс"
            - "8 класс"
            - "11 класс"
          values_kk:
            - "2-сынып"
            - "5-сынып"
            - "8-сынып"
            - "11-сынып"
        - name: "subject"
          values_ru:
            - "математика"
            - "естествознание"
            - "история"
            - "язык"
          values_kk:
            - "математика"
            - "жаратылыстану"
            - "тарих"
            - "тіл"
        - name: "constraint"
          values_ru:
            - "урок 40 минут"
            - "слабый интернет"
            - "работа в парах"
            - "нужна печатная версия"
          values_kk:
            - "сабақ 40 минут"
            - "интернет әлсіз"
            - "жұптық жұмыс"
            - "баспа нұсқасы қажет"
      artifact_binding_ru: "Подставить тему и ограничения участника; при наличии запросить фрагмент его работы «диалог с ИИ и итоговый ответ» и ссылаться на конкретное доказательство."
      artifact_binding_kk: "Қатысушының тақырыбы мен шектеулерін қою; бар болса, оның «ЖИ-мен диалог және қорытынды жауап» жұмысынан үзінді сұрап, нақты дәлелге сілтеу."
  - id: "Q-L01-02"
    lesson_id: "L01"
    track: "foundation"
    type: "error_detection"
    difficulty: "easy"
    learning_goal_ru: "Обнаружить критическую ошибку в артефакте «диалог с ИИ и итоговый ответ» и выбрать исправление."
    learning_goal_kk: "«ЖИ-мен диалог және қорытынды жауап» артефактісіндегі маңызды қатені анықтап, түзетуді таңдау."
    prompt_ru: "В приложенном артефакте «диалог с ИИ и итоговый ответ» обнаружено: запрос не содержит аудиторию, контекст и ожидаемый результат. Что нужно сделать в первую очередь?"
    prompt_kk: "Тіркелген «ЖИ-мен диалог және қорытынды жауап» артефактісінде мына мәселе анықталды: сұрауда аудитория, мәнмәтін және күтілетін нәтиже көрсетілмеген. Ең алдымен не істеу керек?"
    options_ru:
      - "Сохранить версию как есть: визуальная привлекательность важнее."
      - "Добавить декоративный элемент, не меняя содержание."
      - "Исправить указанную ошибку, повторно проверить, что ответ соответствует педагогической цели и может быть проверен, и приложить версию до/после или иной проверяемый след."
      - "Удалить критерии проверки, чтобы ошибка не влияла на оценивание."
    options_kk:
      - "Нұсқаны өзгеріссіз сақтау: көрнекі тартымдылық маңыздырақ."
      - "Мазмұнды өзгертпей сәндік элемент қосу."
      - "Көрсетілген қатені түзетіп, жауап педагогикалық мақсатқа сәйкес және тексеруге болады екенін қайта тексеру және дейін/кейін нұсқасын не басқа тексерілетін дәлелді тіркеу."
      - "Қате бағалауға әсер етпеуі үшін тексеру критерийлерін жою."
    correct_answer: "C"
    rationale_ru: "Сначала устраняется ошибка, влияющая на учебный результат или безопасность. Повторная проверка и доказательство изменения позволяют подтвердить выполнение."
    rationale_kk: "Алдымен оқу нәтижесіне немесе қауіпсіздікке әсер ететін қате түзетіледі. Қайта тексеру және өзгеріс дәлелі орындалуды растауға мүмкіндік береді."
