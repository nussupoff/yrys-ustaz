  - id: "Q-L01-03"
    lesson_id: "L01"
    track: "foundation"
    type: "sequence"
    difficulty: "easy"
    learning_goal_ru: "Выстроить проверяемый процесс для результата «диалог с ИИ и итоговый ответ»."
    learning_goal_kk: "«ЖИ-мен диалог және қорытынды жауап» нәтижесіне арналған тексерілетін үдерісті құру."
    prompt_ru: "Какой порядок действий лучше использовать, чтобы сформулировать задачу для ИИ-помощника и проверить полученный результат и получить проверяемый результат «диалог с ИИ и итоговый ответ»?"
    prompt_kk: "Жи-көмекшіге тапсырманы тұжырымдап, алынған нәтижені тексеру және тексерілетін «ЖИ-мен диалог және қорытынды жауап» нәтижесін алу үшін қай әрекеттер реті дұрыс?"
    options_ru:
      - "Сгенерировать → опубликовать → определить цель → при необходимости проверить."
      - "Выбрать оформление → добавить персональные данные → сгенерировать → удалить критерии."
      - "Определить цель и ограничения → подготовить безопасные входные данные → создать черновик → проверить по критериям → исправить → сохранить доказательство."
      - "Скопировать чужой пример → изменить заголовок → считать работу завершённой."
    options_kk:
      - "Генерациялау → жариялау → мақсатты анықтау → қажет болса тексеру."
      - "Безендіруді таңдау → дербес дерек қосу → генерациялау → критерийлерді жою."
      - "Мақсат пен шектеулерді анықтау → қауіпсіз кіріс деректерін дайындау → нобай жасау → критериймен тексеру → түзету → дәлелді сақтау."
      - "Басқа жұмысты көшіру → тақырыбын өзгерту → жұмысты аяқталды деп санау."
    correct_answer: "C"
