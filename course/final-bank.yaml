    track: "games_sites"
    type: "artifact_analysis"
    difficulty: "hard"
    learning_goal_ru: "Проанализировать собственный артефакт «интерактивная викторина» по доказательствам."
    learning_goal_kk: "Өзінің «интерактивті викторина» артефактісін дәлелдер бойынша талдау."
    prompt_ru: "Приложите или откройте собственный артефакт «интерактивная викторина». Укажите два конкретных фрагмента, подтверждающих, что обратная связь помогает исправить ошибку и продолжить. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «интерактивті викторина» артефактіңізді тіркеңіз немесе ашыңыз. кері байланыс қатені түзетіп, жалғастыруға көмектеседі екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
    rubric_ru:
      - "0–2: представлены два конкретных доказательства из собственной работы, а не общие утверждения."
      - "0–2: доказательства действительно подтверждают критерий: обратная связь помогает исправить ошибку и продолжить."
      - "0–2: предложенное улучшение связано с обнаруженной проблемой."
      - "0–2: приложено проверяемое доказательство изменения — до/после, таймкод, URL, скриншот или журнал теста."
      - "0–2: объяснение не содержит персональных данных учеников и позволяет повторить проверку."
    rubric_kk:
      - "0–2: жалпы тұжырым емес, өз жұмысынан екі нақты дәлел берілген."
      - "0–2: дәлелдер мына критерийді шынымен растайды: кері байланыс қатені түзетіп, жалғастыруға көмектеседі."
      - "0–2: ұсынылған жақсарту анықталған мәселемен байланысты."
      - "0–2: өзгерістің тексерілетін дәлелі тіркелген — дейін/кейін, таймкод, URL, скриншот немесе тест журналы."
      - "0–2: түсіндірмеде оқушының дербес деректері жоқ және тексеруді қайталауға болады."
    rationale_ru: "Задание требует анализа персонального результата, объяснения выбора и доказательства исправления. Это снижает ценность простого копирования ответа, но не заявляет полной AI-proof защиты."
    rationale_kk: "Тапсырма жеке нәтижені талдауды, таңдауды түсіндіруді және түзету дәлелін талап етеді. Бұл дайын жауапты көшірудің пайдасын азайтады, бірақ толық AI-proof қорғанысын мәлімдемейді."
    randomization:
      shuffle_options: false
      parameter_slots:
        - name: "grade"
          values_ru:
            - "2 класс"
            - "5 класс"
            - "8 класс"
            - "11 класс"
          values_kk:
            - "2-сынып"
            - "5-сынып"
            - "8-сынып"
            - "11-сынып"
        - name: "subject"
          values_ru:
            - "математика"
            - "естествознание"
            - "история"
            - "язык"
          values_kk:
            - "математика"
            - "жаратылыстану"
            - "тарих"
            - "тіл"
        - name: "constraint"
          values_ru:
            - "урок 40 минут"
            - "слабый интернет"
            - "работа в парах"
            - "нужна печатная версия"
          values_kk:
            - "сабақ 40 минут"
            - "интернет әлсіз"
            - "жұптық жұмыс"
            - "баспа нұсқасы қажет"
      artifact_binding_ru: "Подставить тему и ограничения участника; при наличии запросить фрагмент его работы «интерактивная викторина» и ссылаться на конкретное доказательство."
      artifact_binding_kk: "Қатысушының тақырыбы мен шектеулерін қою; бар болса, оның «интерактивті викторина» жұмысынан үзінді сұрап, нақты дәлелге сілтеу."
      evidence_count:
        - 2
        - 3
      revision_count:
        - 1
        - 2
      allowed_evidence_ru:
        - "скриншот"
        - "фрагмент текста"
        - "таймкод"
        - "URL"
        - "журнал проверки"
      allowed_evidence_kk:
        - "скриншот"
        - "мәтін үзіндісі"
        - "таймкод"
        - "URL"
        - "тексеру журналы"
