    prompt_ru: "Приложите или откройте собственный артефакт «аналитическая записка». Укажите два конкретных фрагмента, подтверждающих, что выводы отделены от гипотез, ограничения данных указаны. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
