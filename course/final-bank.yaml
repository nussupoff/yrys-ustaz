    learning_goal_ru: "Проанализировать собственный артефакт «мини-тест с ключами» по доказательствам."
    learning_goal_kk: "Өзінің «жауап кілттері бар шағын тест» артефактісін дәлелдер бойынша талдау."
    prompt_ru: "Приложите или откройте собственный артефакт «мини-тест с ключами». Укажите два конкретных фрагмента, подтверждающих, что задания соответствуют цели, а ключи и дистракторы обоснованы. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «жауап кілттері бар шағын тест» артефактіңізді тіркеңіз немесе ашыңыз. тапсырмалар мақсатқа сәйкес, кілттер мен дистракторлар негізделген екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
