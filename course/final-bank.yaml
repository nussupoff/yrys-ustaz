    learning_goal_ru: "Проанализировать собственный артефакт «видео с субтитрами» по доказательствам."
    learning_goal_kk: "Өзінің «субтитрлері бар бейне» артефактісін дәлелдер бойынша талдау."
    prompt_ru: "Приложите или откройте собственный артефакт «видео с субтитрами». Укажите два конкретных фрагмента, подтверждающих, что текст синхронен, терминология точна, размещение не мешает изображению. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «субтитрлері бар бейне» артефактіңізді тіркеңіз немесе ашыңыз. мәтін синхронды, терминология дәл, орналасуы суретке кедергі келтірмейді екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
    rubric_ru:
      - "0–2: представлены два конкретных доказательства из собственной работы, а не общие утверждения."
      - "0–2: доказательства действительно подтверждают критерий: текст синхронен, терминология точна, размещение не мешает изображению."
      - "0–2: предложенное улучшение связано с обнаруженной проблемой."
      - "0–2: приложено проверяемое доказательство изменения — до/после, таймкод, URL, скриншот или журнал теста."
      - "0–2: объяснение не содержит персональных данных учеников и позволяет повторить проверку."
    rubric_kk:
