  - id: "Q-L04-04"
    lesson_id: "L04"
    track: "foundation"
    type: "artifact_analysis"
    difficulty: "easy"
    learning_goal_ru: "Проанализировать собственный артефакт «структурированный промпт» по доказательствам."
    learning_goal_kk: "Өзінің «құрылымды промпт» артефактісін дәлелдер бойынша талдау."
    prompt_ru: "Приложите или откройте собственный артефакт «структурированный промпт». Укажите два конкретных фрагмента, подтверждающих, что все четыре части согласованы и не противоречат друг другу. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «құрылымды промпт» артефактіңізді тіркеңіз немесе ашыңыз. төрт бөліктің бәрі өзара үйлеседі және қайшы келмейді екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
    rubric_ru:
      - "0–2: представлены два конкретных доказательства из собственной работы, а не общие утверждения."
      - "0–2: доказательства действительно подтверждают критерий: все четыре части согласованы и не противоречат друг другу."
      - "0–2: предложенное улучшение связано с обнаруженной проблемой."
      - "0–2: приложено проверяемое доказательство изменения — до/после, таймкод, URL, скриншот или журнал теста."
      - "0–2: объяснение не содержит персональных данных учеников и позволяет повторить проверку."
    rubric_kk:
      - "0–2: жалпы тұжырым емес, өз жұмысынан екі нақты дәлел берілген."
      - "0–2: дәлелдер мына критерийді шынымен растайды: төрт бөліктің бәрі өзара үйлеседі және қайшы келмейді."
      - "0–2: ұсынылған жақсарту анықталған мәселемен байланысты."
      - "0–2: өзгерістің тексерілетін дәлелі тіркелген — дейін/кейін, таймкод, URL, скриншот немесе тест журналы."
