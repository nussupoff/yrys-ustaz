  - id: "Q-L01-04"
    lesson_id: "L01"
    track: "foundation"
    type: "artifact_analysis"
    difficulty: "easy"
    learning_goal_ru: "Проанализировать собственный артефакт «диалог с ИИ и итоговый ответ» по доказательствам."
    learning_goal_kk: "Өзінің «ЖИ-мен диалог және қорытынды жауап» артефактісін дәлелдер бойынша талдау."
    prompt_ru: "Приложите или откройте собственный артефакт «диалог с ИИ и итоговый ответ». Укажите два конкретных фрагмента, подтверждающих, что ответ соответствует педагогической цели и может быть проверен. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «ЖИ-мен диалог және қорытынды жауап» артефактіңізді тіркеңіз немесе ашыңыз. жауап педагогикалық мақсатқа сәйкес және тексеруге болады екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
    rubric_ru:
      - "0–2: представлены два конкретных доказательства из собственной работы, а не общие утверждения."
      - "0–2: доказательства действительно подтверждают критерий: ответ соответствует педагогической цели и может быть проверен."
      - "0–2: предложенное улучшение связано с обнаруженной проблемой."
      - "0–2: приложено проверяемое доказательство изменения — до/после, таймкод, URL, скриншот или журнал теста."
      - "0–2: объяснение не содержит персональных данных учеников и позволяет повторить проверку."
    rubric_kk:
