    prompt_kk: "Өзіңіздің «бейімделген оқу материалы» артефактіңізді тіркеңіз немесе ашыңыз. кедергі аталған, қолдау нақты, оқу мақсаты сақталған екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
