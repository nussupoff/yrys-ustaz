    prompt_ru: "Приложите или откройте собственный артефакт «учебная презентация». Укажите два конкретных фрагмента, подтверждающих, что каждый слайд выполняет понятную функцию в сценарии урока. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «оқу презентациясы» артефактіңізді тіркеңіз немесе ашыңыз. әр слайд сабақ сценарийінде түсінікті қызмет атқарады екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
