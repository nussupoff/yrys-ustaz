    prompt_ru: "Приложите или откройте собственный артефакт «раздаточный лист». Укажите два конкретных фрагмента, подтверждающих, что инструкция выполнима без устного пояснения учителя. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «үлестірме парақ» артефактіңізді тіркеңіз немесе ашыңыз. нұсқау мұғалімнің ауызша түсіндірмесінсіз орындалады екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
