objective_ru: "Создать короткий мультфильм, где последовательность действий действительно объясняет учебное понятие."
objective_kk: "Әрекеттер реттілігі оқу ұғымын шын мәнінде түсіндіретін қысқа мультфильм жасау."
outcomes_ru:
  - "Строит сюжет вокруг причинно-следственной связи."
  - "Сохраняет персонажей и объекты между сценами."
outcomes_kk:
  - "Сюжетті себеп-салдар байланысына құрады."
  - "Көріністер арасында кейіпкерлер мен нысандарды сақтайды."
