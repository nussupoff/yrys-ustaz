      kk: "Сюжет ұғымды түсіндіреді."
    - ru: "Ключевые объекты стабильны."
      kk: "Негізгі нысандар тұрақты."
    - ru: "Финальный вывод соответствует источнику."
      kk: "Соңғы қорытынды дереккөзге сәйкес."
assessment_brief:
  outputs:
