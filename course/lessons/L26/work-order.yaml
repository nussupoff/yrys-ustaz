    - "course/lessons/L26/qa-report.md"
  question_ids:
    - "Q-L26-01"
    - "Q-L26-02"
    - "Q-L26-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Сюжет объясняет понятие.; Ключевые объекты стабильны.; Финальный вывод соответствует источнику.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Сюжет ұғымды түсіндіреді.; Негізгі нысандар тұрақты.; Соңғы қорытынды дереккөзге сәйкес.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Сюжет объясняет понятие."
