teacher_artifact:
  ru: "Короткий объясняющий мультфильм и сториборд."
  kk: "Қысқа түсіндіру мультфильмі және сториборд."
writer_brief:
  output: "course/lessons/L26/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: сториборд, сцена, причинно-следственная связь, согласованность персонажа. Маршрут: Выбрать одно понятие.; Создать сториборд из начала, изменения и вывода.; Проверить, понятен ли смысл без лишнего декора.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: сториборд, көрініс, себеп-салдар байланысы, кейіпкер бірізділігі. Бағыт: Бір ұғымды таңдау.; Басталуы, өзгерісі және қорытындысы бар сториборд жасау.; Мағына артық безендірусіз түсінікті екенін тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Сюжет объясняет понятие."
      kk: "Сюжет ұғымды түсіндіреді."
    - ru: "Ключевые объекты стабильны."
      kk: "Негізгі нысандар тұрақты."
    - ru: "Финальный вывод соответствует источнику."
      kk: "Соңғы қорытынды дереккөзге сәйкес."
video_brief:
  output: "course/lessons/L26/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Выбрать одно понятие.; Создать сториборд из начала, изменения и вывода.; Проверить, понятен ли смысл без лишнего декора.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Бір ұғымды таңдау.; Басталуы, өзгерісі және қорытындысы бар сториборд жасау.; Мағына артық безендірусіз түсінікті екенін тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L26/prompts.md"
    - "course/lessons/L26/assignment.md"
  prompt_ids:
    - "P-L26-01"
    - "P-L26-02"
  assignment_id: "A-L26-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Короткий объясняющий мультфильм и сториборд. Шаги: Выбрать одно понятие.; Создать сториборд из начала, изменения и вывода.; Проверить, понятен ли смысл без лишнего декора.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Қысқа түсіндіру мультфильмі және сториборд. Қадамдар: Бір ұғымды таңдау.; Басталуы, өзгерісі және қорытындысы бар сториборд жасау.; Мағына артық безендірусіз түсінікті екенін тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
