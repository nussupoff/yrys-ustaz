      kk: "Қарқын қайталауға мүмкіндік береді."
    - ru: "Есть предупреждение остановиться при дискомфорте."
      kk: "Жайсыздық болса тоқтау ескертуі бар."
    - ru: "Альтернатива равноценна по участию."
      kk: "Балама қатысу жағынан тең."
assessment_brief:
  outputs:
    - "course/lessons/L27/quiz.yaml"
    - "course/lessons/L27/qa-report.md"
  question_ids:
    - "Q-L27-01"
    - "Q-L27-02"
    - "Q-L27-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Темп позволяет повторять.; Есть предупреждение остановиться при дискомфорте.; Альтернатива равноценна по участию.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Қарқын қайталауға мүмкіндік береді.; Жайсыздық болса тоқтау ескертуі бар.; Балама қатысу жағынан тең.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Темп позволяет повторять."
