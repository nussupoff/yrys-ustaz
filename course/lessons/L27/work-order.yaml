objective_ru: "Создать короткую видео-разминку с безопасными движениями, понятным темпом и альтернативой выполнения."
objective_kk: "Қауіпсіз қимылдары, түсінікті қарқыны және орындаудың баламасы бар қысқа видео сергіту жасау."
outcomes_ru:
  - "Даёт визуальный и словесный сигнал каждому движению."
  - "Предлагает безопасную альтернативу без медицинских обещаний."
outcomes_kk:
  - "Әр қимылға визуалдық және сөздік белгі береді."
  - "Медициналық уәдесіз қауіпсіз балама ұсынады."
