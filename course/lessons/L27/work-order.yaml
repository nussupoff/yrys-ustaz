teacher_artifact:
  ru: "Видео-разминка с тремя-пятью простыми движениями."
  kk: "Үш-бес қарапайым қимылы бар видео сергіту."
writer_brief:
  output: "course/lessons/L27/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: темп, повтор, сигнал, безопасная альтернатива. Маршрут: Выбрать движения без оборудования.; Показать начало и конец каждого движения.; Добавить сидячую или малую альтернативу.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: қарқын, қайталау, белгі, қауіпсіз балама. Бағыт: Құралсыз орындалатын қимылдарды таңдау.; Әр қимылдың басталуы мен аяқталуын көрсету.; Отырып немесе аз қимылмен орындалатын балама қосу.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Темп позволяет повторять."
      kk: "Қарқын қайталауға мүмкіндік береді."
    - ru: "Есть предупреждение остановиться при дискомфорте."
      kk: "Жайсыздық болса тоқтау ескертуі бар."
    - ru: "Альтернатива равноценна по участию."
      kk: "Балама қатысу жағынан тең."
video_brief:
  output: "course/lessons/L27/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Выбрать движения без оборудования.; Показать начало и конец каждого движения.; Добавить сидячую или малую альтернативу.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Құралсыз орындалатын қимылдарды таңдау.; Әр қимылдың басталуы мен аяқталуын көрсету.; Отырып немесе аз қимылмен орындалатын балама қосу.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L27/prompts.md"
    - "course/lessons/L27/assignment.md"
  prompt_ids:
    - "P-L27-01"
    - "P-L27-02"
  assignment_id: "A-L27-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Видео-разминка с тремя-пятью простыми движениями. Шаги: Выбрать движения без оборудования.; Показать начало и конец каждого движения.; Добавить сидячую или малую альтернативу.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Үш-бес қарапайым қимылы бар видео сергіту. Қадамдар: Құралсыз орындалатын қимылдарды таңдау.; Әр қимылдың басталуы мен аяқталуын көрсету.; Отырып немесе аз қимылмен орындалатын балама қосу.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
