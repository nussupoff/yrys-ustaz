      kk: "Екі диалог көрінеді."
    - ru: "Использована одна и та же проверяемая задача."
      kk: "Бірдей тексерілетін тапсырма қолданылған."
    - ru: "Различие объяснено без утверждения о непроверенной функции памяти."
      kk: "Айырмашылық тексерілмеген жад функциясын бар деп көрсетпей түсіндірілген."
assessment_brief:
  outputs:
    - "course/lessons/L02/quiz.yaml"
    - "course/lessons/L02/qa-report.md"
  question_ids:
    - "Q-L02-01"
    - "Q-L02-02"
    - "Q-L02-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Видны два диалога.; Использована одна и та же проверяемая задача.; Различие объяснено без утверждения о непроверенной функции памяти.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Екі диалог көрінеді.; Бірдей тексерілетін тапсырма қолданылған.; Айырмашылық тексерілмеген жад функциясын бар деп көрсетпей түсіндірілген.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Видны два диалога."
      kk: "Екі диалог көрінеді."
    - ru: "Использована одна и та же проверяемая задача."
      kk: "Бірдей тексерілетін тапсырма қолданылған."
    - ru: "Различие объяснено без утверждения о непроверенной функции памяти."
      kk: "Айырмашылық тексерілмеген жад функциясын бар деп көрсетпей түсіндірілген."
  mandatory_qa:
