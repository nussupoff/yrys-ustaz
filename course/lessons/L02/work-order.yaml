track: "0-foundation"
estimated_video_seconds: "120-180"
topic_ru: "Память помощника и контекст"
topic_kk: "Көмекші жады және контекст"
objective_ru: "Провести два коротких диалога и доказать по скриншотам, как ранее переданный контекст влияет на следующий ответ."
objective_kk: "Екі қысқа диалог өткізіп, бұрын берілген контекстің келесі жауапқа қалай әсер ететінін скриншоттармен дәлелдеу."
outcomes_ru:
  - "Отличает контекст текущего диалога от долговременной памяти."
  - "Формулирует, какие сведения нельзя сохранять."
outcomes_kk:
  - "Ағымдағы диалог контекстін ұзақ мерзімді жадтан ажыратады."
  - "Қандай мәліметтерді сақтауға болмайтынын тұжырымдайды."
prerequisites:
  - "L01"
