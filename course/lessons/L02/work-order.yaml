teacher_artifact:
  ru: "Один скрин или коллаж двух обезличенных диалогов с подписью различия."
  kk: "Айырмашылығы түсіндірілген екі иесіздендірілген диалогтың бір скрині немесе коллажы."
writer_brief:
  output: "course/lessons/L02/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: контекст, память, новый диалог, сброс контекста. Маршрут: Задать синтетический контекст в первом диалоге.; Повторить вопрос с контекстом и без него.; Подписать наблюдаемое различие.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: контекст, жад, жаңа диалог, контексті тазарту. Бағыт: Бірінші диалогта синтетикалық контекст беру.; Сұрақты контекстпен және контекстсіз қайталау.; Бақыланған айырмашылықты жазу.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Видны два диалога."
      kk: "Екі диалог көрінеді."
    - ru: "Использована одна и та же проверяемая задача."
      kk: "Бірдей тексерілетін тапсырма қолданылған."
    - ru: "Различие объяснено без утверждения о непроверенной функции памяти."
      kk: "Айырмашылық тексерілмеген жад функциясын бар деп көрсетпей түсіндірілген."
video_brief:
  output: "course/lessons/L02/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Задать синтетический контекст в первом диалоге.; Повторить вопрос с контекстом и без него.; Подписать наблюдаемое различие.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Бірінші диалогта синтетикалық контекст беру.; Сұрақты контекстпен және контекстсіз қайталау.; Бақыланған айырмашылықты жазу.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L02/prompts.md"
    - "course/lessons/L02/assignment.md"
  prompt_ids:
    - "P-L02-01"
    - "P-L02-02"
  assignment_id: "A-L02-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Один скрин или коллаж двух обезличенных диалогов с подписью различия. Шаги: Задать синтетический контекст в первом диалоге.; Повторить вопрос с контекстом и без него.; Подписать наблюдаемое различие.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Айырмашылығы түсіндірілген екі иесіздендірілген диалогтың бір скрині немесе коллажы. Қадамдар: Бірінші диалогта синтетикалық контекст беру.; Сұрақты контекстпен және контекстсіз қайталау.; Бақыланған айырмашылықты жазу.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
