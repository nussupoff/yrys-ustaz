objective_ru: "Создать выполнимый сценарий мероприятия с таймингом, ролями, ресурсами, добровольным участием и планом B."
objective_kk: "Уақыты, рөлдері, ресурстары, ерікті қатысуы және B жоспары бар орындалатын іс-шара сценарийін жасау."
outcomes_ru:
  - "Распределяет этапы и переходы в заданное время."
  - "Предлагает безопасную равноценную альтернативу участию."
outcomes_kk:
  - "Кезеңдер мен ауысуларды берілген уақытқа бөледі."
  - "Қатысуға қауіпсіз әрі тең балама ұсынады."
