    - "Q-L12-02"
    - "Q-L12-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Сумма этапов и переходов сходится.; Участие не принудительное.; План B работает без отказавшего ресурса.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Кезеңдер мен ауысулар уақыты сәйкес.; Қатысу мәжбүрлі емес.; B жоспары істен шыққан ресурссыз орындалады.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Сумма этапов и переходов сходится."
      kk: "Кезеңдер мен ауысулар уақыты сәйкес."
