teacher_artifact:
  ru: "Файл сценария мероприятия с таблицей этапов."
  kk: "Кезеңдер кестесі бар іс-шара сценарийінің файлы."
writer_brief:
  output: "course/lessons/L12/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: тайминг, роль, ресурс, добровольное участие, план B. Маршрут: Задать цель, аудиторию и длительность.; Распределить этапы, роли и материалы.; Добавить безопасную альтернативу и план B.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: тайминг, рөл, ресурс, ерікті қатысу, B жоспары. Бағыт: Мақсатты, аудиторияны және ұзақтықты беру.; Кезеңдерді, рөлдерді және материалдарды бөлу.; Қауіпсіз балама мен B жоспарын қосу.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Сумма этапов и переходов сходится."
      kk: "Кезеңдер мен ауысулар уақыты сәйкес."
    - ru: "Участие не принудительное."
      kk: "Қатысу мәжбүрлі емес."
    - ru: "План B работает без отказавшего ресурса."
      kk: "B жоспары істен шыққан ресурссыз орындалады."
video_brief:
  output: "course/lessons/L12/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Задать цель, аудиторию и длительность.; Распределить этапы, роли и материалы.; Добавить безопасную альтернативу и план B.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Мақсатты, аудиторияны және ұзақтықты беру.; Кезеңдерді, рөлдерді және материалдарды бөлу.; Қауіпсіз балама мен B жоспарын қосу.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L12/prompts.md"
    - "course/lessons/L12/assignment.md"
  prompt_ids:
    - "P-L12-01"
    - "P-L12-02"
  assignment_id: "A-L12-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Файл сценария мероприятия с таблицей этапов. Шаги: Задать цель, аудиторию и длительность.; Распределить этапы, роли и материалы.; Добавить безопасную альтернативу и план B.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Кезеңдер кестесі бар іс-шара сценарийінің файлы. Қадамдар: Мақсатты, аудиторияны және ұзақтықты беру.; Кезеңдерді, рөлдерді және материалдарды бөлу.; Қауіпсіз балама мен B жоспарын қосу.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
