teacher_artifact:
  ru: "Обезличенный запрос и краткий список удалённых рисков."
  kk: "Иесіздендірілген сұрау және жойылған тәуекелдердің қысқа тізімі."
writer_brief:
  output: "course/lessons/L05/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: персональные данные, анонимизация, косвенный идентификатор, синтетические данные. Маршрут: Отметить идентификаторы в рискованном примере.; Заменить их нейтральными признаками.; Проверить, сохранилась ли учебная цель.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: дербес деректер, иесіздендіру, жанама сәйкестендіргіш, синтетикалық деректер. Бағыт: Тәуекелді мысалдағы сәйкестендіргіштерді белгілеу.; Оларды бейтарап белгілермен алмастыру.; Оқу мақсаты сақталғанын тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Нет прямых и косвенных идентификаторов."
      kk: "Тікелей және жанама сәйкестендіргіш жоқ."
    - ru: "Смысл задачи сохранён."
      kk: "Тапсырма мағынасы сақталған."
    - ru: "Использованы диапазоны или синтетические данные."
      kk: "Ауқымдар немесе синтетикалық деректер қолданылған."
video_brief:
  output: "course/lessons/L05/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Отметить идентификаторы в рискованном примере.; Заменить их нейтральными признаками.; Проверить, сохранилась ли учебная цель.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Тәуекелді мысалдағы сәйкестендіргіштерді белгілеу.; Оларды бейтарап белгілермен алмастыру.; Оқу мақсаты сақталғанын тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L05/prompts.md"
    - "course/lessons/L05/assignment.md"
  prompt_ids:
    - "P-L05-01"
    - "P-L05-02"
  assignment_id: "A-L05-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Обезличенный запрос и краткий список удалённых рисков. Шаги: Отметить идентификаторы в рискованном примере.; Заменить их нейтральными признаками.; Проверить, сохранилась ли учебная цель.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Иесіздендірілген сұрау және жойылған тәуекелдердің қысқа тізімі. Қадамдар: Тәуекелді мысалдағы сәйкестендіргіштерді белгілеу.; Оларды бейтарап белгілермен алмастыру.; Оқу мақсаты сақталғанын тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Нет прямых и косвенных идентификаторов."
      kk: "Тікелей және жанама сәйкестендіргіш жоқ."
    - ru: "Смысл задачи сохранён."
      kk: "Тапсырма мағынасы сақталған."
    - ru: "Использованы диапазоны или синтетические данные."
      kk: "Ауқымдар немесе синтетикалық деректер қолданылған."
assessment_brief:
  outputs:
    - "course/lessons/L05/quiz.yaml"
    - "course/lessons/L05/qa-report.md"
  question_ids:
    - "Q-L05-01"
    - "Q-L05-02"
    - "Q-L05-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Нет прямых и косвенных идентификаторов.; Смысл задачи сохранён.; Использованы диапазоны или синтетические данные.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Тікелей және жанама сәйкестендіргіш жоқ.; Тапсырма мағынасы сақталған.; Ауқымдар немесе синтетикалық деректер қолданылған.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Нет прямых и косвенных идентификаторов."
      kk: "Тікелей және жанама сәйкестендіргіш жоқ."
    - ru: "Смысл задачи сохранён."
      kk: "Тапсырма мағынасы сақталған."
    - ru: "Использованы диапазоны или синтетические данные."
      kk: "Ауқымдар немесе синтетикалық деректер қолданылған."
  mandatory_qa:
    - "RU/KK semantic parity"
    - "stable IDs"
    - "attachment opens"
    - "no student personal data"
    - "facts and answer keys checked"
    - "UI verified or dual markers retained"
    - "accessibility checked"
    - "QA PASS only"
attachment_type:
  - "text"
  - "md"
safety_notes:
  ru: "Использовать только обезличенные или синтетические данные. Не загружать ФИО, контакты, оценки, диагнозы, фотографии и голоса учеников. Проверять факты, возрастную уместность, авторские права и явно указывать роль ИИ. Не использовать реальные ученические данные даже в демонстрации ошибки."
  kk: "Тек иесіздендірілген немесе синтетикалық деректерді пайдалану. Оқушылардың аты-жөнін, байланысын, бағасын, диагнозын, фотосын және дауысын жүктемеу. Фактілерді, жасқа сәйкестікті, авторлық құқықты тексеріп, ЖИ рөлін ашық көрсету. Қате мысалында да оқушылардың нақты деректерін қолданбау."
