objective_ru: "Удалить прямые и косвенные идентификаторы из учебного запроса, сохранив педагогическую задачу."
objective_kk: "Оқу сұрауынан тікелей және жанама сәйкестендіргіштерді алып тастап, педагогикалық міндетті сақтау."
