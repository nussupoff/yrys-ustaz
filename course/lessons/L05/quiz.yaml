  - id: "Q-L05-02"
    lesson_id: "L05"
    track: "foundation"
    type: "error_detection"
    difficulty: "easy"
    learning_goal_ru: "Обнаружить критическую ошибку в артефакте «обезличенный учебный пример» и выбрать исправление."
    learning_goal_kk: "«иесіздендірілген оқу мысалы» артефактісіндегі маңызды қатені анықтап, түзетуді таңдау."
    prompt_ru: "В приложенном артефакте «обезличенный учебный пример» обнаружено: в промпте сохранены ФИО, контакты или иные идентификаторы ученика. Что нужно сделать в первую очередь?"
    prompt_kk: "Тіркелген «иесіздендірілген оқу мысалы» артефактісінде мына мәселе анықталды: промптте оқушының аты-жөні, байланысы немесе басқа идентификаторлары қалған. Ең алдымен не істеу керек?"
    options_ru:
      - "Сохранить версию как есть: визуальная привлекательность важнее."
      - "Добавить декоративный элемент, не меняя содержание."
      - "Исправить указанную ошибку, повторно проверить, что персональные данные удалены или заменены нейтральными метками, и приложить версию до/после или иной проверяемый след."
      - "Удалить критерии проверки, чтобы ошибка не влияла на оценивание."
    options_kk:
      - "Нұсқаны өзгеріссіз сақтау: көрнекі тартымдылық маңыздырақ."
      - "Мазмұнды өзгертпей сәндік элемент қосу."
      - "Көрсетілген қатені түзетіп, дербес деректер жойылған немесе бейтарап белгілермен ауыстырылған екенін қайта тексеру және дейін/кейін нұсқасын не басқа тексерілетін дәлелді тіркеу."
      - "Қате бағалауға әсер етпеуі үшін тексеру критерийлерін жою."
    correct_answer: "C"
    rationale_ru: "Сначала устраняется ошибка, влияющая на учебный результат или безопасность. Повторная проверка и доказательство изменения позволяют подтвердить выполнение."
    rationale_kk: "Алдымен оқу нәтижесіне немесе қауіпсіздікке әсер ететін қате түзетіледі. Қайта тексеру және өзгеріс дәлелі орындалуды растауға мүмкіндік береді."
