objective_ru: "Создать короткий вступительный ролик с хуком, учебной целью и ясным призывом к следующему действию."
objective_kk: "Ілмегі, оқу мақсаты және келесі әрекетке анық шақыруы бар қысқа кіріспе ролик жасау."
