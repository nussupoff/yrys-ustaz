  question_ids:
    - "Q-L25-01"
    - "Q-L25-02"
    - "Q-L25-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Длительность 30–60 секунд.; Хук связан с темой.; Зритель понимает следующее действие.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Ұзақтығы 30–60 секунд.; Ілмек тақырыппен байланысты.; Көрермен келесі әрекетті түсінеді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
