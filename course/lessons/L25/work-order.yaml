writer_brief:
  output: "course/lessons/L25/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: хук, кадр, CTA, тайминг, озвучивание. Маршрут: Написать хук и цель.; Разбить ролик на три-пять кадров.; Добавить CTA и проверить длительность.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: ілмек, кадр, CTA, тайминг, дыбыстау. Бағыт: Ілмек пен мақсатты жазу.; Роликті үш-бес кадрға бөлу.; CTA қосып, ұзақтығын тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Длительность 30–60 секунд."
      kk: "Ұзақтығы 30–60 секунд."
    - ru: "Хук связан с темой."
      kk: "Ілмек тақырыппен байланысты."
    - ru: "Зритель понимает следующее действие."
      kk: "Көрермен келесі әрекетті түсінеді."
video_brief:
  output: "course/lessons/L25/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Написать хук и цель.; Разбить ролик на три-пять кадров.; Добавить CTA и проверить длительность.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Ілмек пен мақсатты жазу.; Роликті үш-бес кадрға бөлу.; CTA қосып, ұзақтығын тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L25/prompts.md"
    - "course/lessons/L25/assignment.md"
  prompt_ids:
    - "P-L25-01"
    - "P-L25-02"
  assignment_id: "A-L25-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Вступительный ролик длительностью 30–60 секунд. Шаги: Написать хук и цель.; Разбить ролик на три-пять кадров.; Добавить CTA и проверить длительность.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Ұзақтығы 30–60 секунд болатын кіріспе ролик. Қадамдар: Ілмек пен мақсатты жазу.; Роликті үш-бес кадрға бөлу.; CTA қосып, ұзақтығын тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
