  assignment_id: "A-L09-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Три варианта задания: с опорой, базовый и расширенный. Шаги: Зафиксировать одну цель.; Изменить подсказки, объём и самостоятельность.; Сверить три варианта с общим критерием.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Үш тапсырма нұсқасы: тірекпен, негізгі және кеңейтілген. Қадамдар: Бір мақсатты бекіту.; Көмек, көлем және дербестік деңгейін өзгерту.; Үш нұсқаны ортақ өлшемшартпен салыстыру.."
  required_prompt_placeholders:
