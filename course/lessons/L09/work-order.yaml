    - "Q-L09-02"
    - "Q-L09-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Все варианты ведут к одной цели.; Поддержка различается явно.; Ни один уровень не маркирует способности ребёнка.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Барлық нұсқа бір мақсатқа апарады.; Қолдау деңгейі анық ерекшеленеді.; Ешбір деңгей баланың қабілетін таңбаламайды.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
