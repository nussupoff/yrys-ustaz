topic_kk: "Үш деңгейлі тапсырмалар"
objective_ru: "Создать три задания на одну учебную цель с разной степенью опоры, а не с разными целями."
objective_kk: "Бір оқу мақсатына тірек деңгейі әртүрлі, бірақ мақсаты өзгермейтін үш тапсырма жасау."
outcomes_ru:
  - "Различает усложнение содержания и изменение поддержки."
  - "Формулирует общие критерии успеха."
outcomes_kk:
  - "Мазмұнды күрделендіру мен қолдауды өзгертуді ажыратады."
  - "Ортақ жетістік өлшемшарттарын тұжырымдайды."
