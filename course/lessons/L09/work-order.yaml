teacher_artifact:
  ru: "Три варианта задания: с опорой, базовый и расширенный."
  kk: "Үш тапсырма нұсқасы: тірекпен, негізгі және кеңейтілген."
writer_brief:
  output: "course/lessons/L09/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: дифференциация, уровень поддержки, критерий успеха, учебная цель. Маршрут: Зафиксировать одну цель.; Изменить подсказки, объём и самостоятельность.; Сверить три варианта с общим критерием.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: саралау, қолдау деңгейі, жетістік өлшемшарты, оқу мақсаты. Бағыт: Бір мақсатты бекіту.; Көмек, көлем және дербестік деңгейін өзгерту.; Үш нұсқаны ортақ өлшемшартпен салыстыру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Все варианты ведут к одной цели."
      kk: "Барлық нұсқа бір мақсатқа апарады."
    - ru: "Поддержка различается явно."
      kk: "Қолдау деңгейі анық ерекшеленеді."
    - ru: "Ни один уровень не маркирует способности ребёнка."
      kk: "Ешбір деңгей баланың қабілетін таңбаламайды."
video_brief:
  output: "course/lessons/L09/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Зафиксировать одну цель.; Изменить подсказки, объём и самостоятельность.; Сверить три варианта с общим критерием.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Бір мақсатты бекіту.; Көмек, көлем және дербестік деңгейін өзгерту.; Үш нұсқаны ортақ өлшемшартпен салыстыру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
