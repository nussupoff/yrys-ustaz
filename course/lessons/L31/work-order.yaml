      kk: "Механика оқу мақсатына қызмет етеді."
    - ru: "Правила понятны без устного дополнения."
      kk: "Ереже ауызша толықтырусыз түсінікті."
    - ru: "Сложность меняется без смены цели."
      kk: "Күрделілік мақсатты өзгертпей ауысады."
assessment_brief:
  outputs:
    - "course/lessons/L31/quiz.yaml"
    - "course/lessons/L31/qa-report.md"
  question_ids:
    - "Q-L31-01"
    - "Q-L31-02"
    - "Q-L31-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Механика служит учебной цели.; Правила понятны без устного дополнения.; Сложность меняется без смены цели.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Механика оқу мақсатына қызмет етеді.; Ереже ауызша толықтырусыз түсінікті.; Күрделілік мақсатты өзгертпей ауысады.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Механика служит учебной цели."
