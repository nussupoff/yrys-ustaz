teacher_artifact:
  ru: "Работающая предметная игра и краткая инструкция учителю."
  kk: "Жұмыс істейтін пәндік ойын және мұғалімге қысқа нұсқау."
writer_brief:
  output: "course/lessons/L31/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: игровая механика, уровень сложности, подсказка, условие победы. Маршрут: Зафиксировать цель и проверяемое действие.; Выбрать механику, которая тренирует это действие.; Добавить уровни поддержки и протестировать ответы.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: ойын механикасы, күрделілік деңгейі, көмек, жеңіс шарты. Бағыт: Мақсат пен тексерілетін әрекетті бекіту.; Осы әрекетті жаттықтыратын механиканы таңдау.; Қолдау деңгейлерін қосып, жауаптарды тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Механика служит учебной цели."
      kk: "Механика оқу мақсатына қызмет етеді."
    - ru: "Правила понятны без устного дополнения."
      kk: "Ереже ауызша толықтырусыз түсінікті."
    - ru: "Сложность меняется без смены цели."
      kk: "Күрделілік мақсатты өзгертпей ауысады."
video_brief:
  output: "course/lessons/L31/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Зафиксировать цель и проверяемое действие.; Выбрать механику, которая тренирует это действие.; Добавить уровни поддержки и протестировать ответы.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Мақсат пен тексерілетін әрекетті бекіту.; Осы әрекетті жаттықтыратын механиканы таңдау.; Қолдау деңгейлерін қосып, жауаптарды тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L31/prompts.md"
    - "course/lessons/L31/assignment.md"
  prompt_ids:
    - "P-L31-01"
    - "P-L31-02"
  assignment_id: "A-L31-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Работающая предметная игра и краткая инструкция учителю. Шаги: Зафиксировать цель и проверяемое действие.; Выбрать механику, которая тренирует это действие.; Добавить уровни поддержки и протестировать ответы.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Жұмыс істейтін пәндік ойын және мұғалімге қысқа нұсқау. Қадамдар: Мақсат пен тексерілетін әрекетті бекіту.; Осы әрекетті жаттықтыратын механиканы таңдау.; Қолдау деңгейлерін қосып, жауаптарды тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
