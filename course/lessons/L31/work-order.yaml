topic_ru: "Предметная учебная игра"
topic_kk: "Пәндік оқу ойыны"
objective_ru: "Создать предметную игру с одной измеримой целью, понятными правилами и несколькими уровнями поддержки."
objective_kk: "Бір өлшенетін мақсаты, түсінікті ережелері және бірнеше қолдау деңгейі бар пәндік ойын жасау."
outcomes_ru:
  - "Отличает учебную механику от декоративной."
  - "Проверяет сложность и корректность предметных ответов."
outcomes_kk:
  - "Оқу механикасын сәндік элементтен ажыратады."
  - "Күрделілік пен пәндік жауаптардың дұрыстығын тексереді."
