objective_ru: "Создать тест из десяти однозначных вопросов с ключами и краткими объяснениями."
objective_kk: "Жауап кілттері және қысқа түсіндірмелері бар он бірмәнді сұрақтан тұратын тест жасау."
outcomes_ru:
  - "Соотносит каждый вопрос с учебной целью."
  - "Проверяет ключи независимым повторным решением."
outcomes_kk:
  - "Әр сұрақты оқу мақсатымен сәйкестендіреді."
  - "Кілттерді тәуелсіз қайта шешу арқылы тексереді."
