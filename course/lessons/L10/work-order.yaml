teacher_artifact:
  ru: "Тест из 10 вопросов с ключом и объяснением каждого ответа."
  kk: "Әр жауабының кілті мен түсіндірмесі бар 10 сұрақтық тест."
writer_brief:
  output: "course/lessons/L10/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: тестовый вопрос, дистрактор, ключ, объяснение ответа. Маршрут: Задать цель и охват содержания.; Создать вопросы и правдоподобные дистракторы.; Решить тест повторно и исправить неоднозначности.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: тест сұрағы, дистрактор, жауап кілті, жауап түсіндірмесі. Бағыт: Мақсат пен мазмұн ауқымын беру.; Сұрақтар мен шынайы дистракторлар жасау.; Тестті қайта шешіп, екіұштылықтарды түзету.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Ровно десять вопросов."
      kk: "Дәл он сұрақ бар."
    - ru: "У каждого вопроса один обоснованный ключ."
      kk: "Әр сұрақта бір негізделген кілт бар."
    - ru: "Нет подсказок формой или длиной ответа."
      kk: "Жауап пішіні немесе ұзындығы арқылы ишара жоқ."
video_brief:
  output: "course/lessons/L10/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Задать цель и охват содержания.; Создать вопросы и правдоподобные дистракторы.; Решить тест повторно и исправить неоднозначности.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Мақсат пен мазмұн ауқымын беру.; Сұрақтар мен шынайы дистракторлар жасау.; Тестті қайта шешіп, екіұштылықтарды түзету.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L10/prompts.md"
    - "course/lessons/L10/assignment.md"
  prompt_ids:
    - "P-L10-01"
    - "P-L10-02"
  assignment_id: "A-L10-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Тест из 10 вопросов с ключом и объяснением каждого ответа. Шаги: Задать цель и охват содержания.; Создать вопросы и правдоподобные дистракторы.; Решить тест повторно и исправить неоднозначности.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Әр жауабының кілті мен түсіндірмесі бар 10 сұрақтық тест. Қадамдар: Мақсат пен мазмұн ауқымын беру.; Сұрақтар мен шынайы дистракторлар жасау.; Тестті қайта шешіп, екіұштылықтарды түзету.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
