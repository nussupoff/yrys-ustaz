      kk: "Дәл он сұрақ бар."
    - ru: "У каждого вопроса один обоснованный ключ."
      kk: "Әр сұрақта бір негізделген кілт бар."
    - ru: "Нет подсказок формой или длиной ответа."
      kk: "Жауап пішіні немесе ұзындығы арқылы ишара жоқ."
assessment_brief:
  outputs:
    - "course/lessons/L10/quiz.yaml"
    - "course/lessons/L10/qa-report.md"
  question_ids:
    - "Q-L10-01"
    - "Q-L10-02"
    - "Q-L10-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Ровно десять вопросов.; У каждого вопроса один обоснованный ключ.; Нет подсказок формой или длиной ответа.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Дәл он сұрақ бар.; Әр сұрақта бір негізделген кілт бар.; Жауап пішіні немесе ұзындығы арқылы ишара жоқ.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Ровно десять вопросов."
      kk: "Дәл он сұрақ бар."
    - ru: "У каждого вопроса один обоснованный ключ."
      kk: "Әр сұрақта бір негізделген кілт бар."
    - ru: "Нет подсказок формой или длиной ответа."
      kk: "Жауап пішіні немесе ұзындығы арқылы ишара жоқ."
