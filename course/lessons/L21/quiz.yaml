  - id: "Q-L21-04"
    lesson_id: "L21"
    track: "presentations"
    type: "artifact_analysis"
    difficulty: "medium"
    learning_goal_ru: "Проанализировать собственный артефакт «слайд с собственной иллюстрацией» по доказательствам."
    learning_goal_kk: "Өзінің «өз иллюстрациясы бар слайд» артефактісін дәлелдер бойынша талдау."
    prompt_ru: "Приложите или откройте собственный артефакт «слайд с собственной иллюстрацией». Укажите два конкретных фрагмента, подтверждающих, что пропорции сохранены, смысловой объект виден, источник или статус изображения понятен. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «өз иллюстрациясы бар слайд» артефактіңізді тіркеңіз немесе ашыңыз. пропорция сақталған, мағыналы нысан көрінеді, сурет көзі немесе мәртебесі түсінікті екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
    rubric_ru:
      - "0–2: представлены два конкретных доказательства из собственной работы, а не общие утверждения."
      - "0–2: доказательства действительно подтверждают критерий: пропорции сохранены, смысловой объект виден, источник или статус изображения понятен."
      - "0–2: предложенное улучшение связано с обнаруженной проблемой."
      - "0–2: приложено проверяемое доказательство изменения — до/после, таймкод, URL, скриншот или журнал теста."
      - "0–2: объяснение не содержит персональных данных учеников и позволяет повторить проверку."
    rubric_kk:
      - "0–2: жалпы тұжырым емес, өз жұмысынан екі нақты дәлел берілген."
      - "0–2: дәлелдер мына критерийді шынымен растайды: пропорция сақталған, мағыналы нысан көрінеді, сурет көзі немесе мәртебесі түсінікті."
      - "0–2: ұсынылған жақсарту анықталған мәселемен байланысты."
      - "0–2: өзгерістің тексерілетін дәлелі тіркелген — дейін/кейін, таймкод, URL, скриншот немесе тест журналы."
      - "0–2: түсіндірмеде оқушының дербес деректері жоқ және тексеруді қайталауға болады."
    rationale_ru: "Задание требует анализа персонального результата, объяснения выбора и доказательства исправления. Это снижает ценность простого копирования ответа, но не заявляет полной AI-proof защиты."
    rationale_kk: "Тапсырма жеке нәтижені талдауды, таңдауды түсіндіруді және түзету дәлелін талап етеді. Бұл дайын жауапты көшірудің пайдасын азайтады, бірақ толық AI-proof қорғанысын мәлімдемейді."
    randomization:
      shuffle_options: false
