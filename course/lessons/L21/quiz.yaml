            - "слабый интернет"
            - "работа в парах"
            - "нужна печатная версия"
          values_kk:
            - "сабақ 40 минут"
            - "интернет әлсіз"
            - "жұптық жұмыс"
            - "баспа нұсқасы қажет"
      artifact_binding_ru: "Подставить тему и ограничения участника; при наличии запросить фрагмент его работы «слайд с собственной иллюстрацией» и ссылаться на конкретное доказательство."
      artifact_binding_kk: "Қатысушының тақырыбы мен шектеулерін қою; бар болса, оның «өз иллюстрациясы бар слайд» жұмысынан үзінді сұрап, нақты дәлелге сілтеу."
  - id: "Q-L21-02"
    lesson_id: "L21"
    track: "presentations"
    type: "error_detection"
    difficulty: "medium"
    learning_goal_ru: "Обнаружить критическую ошибку в артефакте «слайд с собственной иллюстрацией» и выбрать исправление."
    learning_goal_kk: "«өз иллюстрациясы бар слайд» артефактісіндегі маңызды қатені анықтап, түзетуді таңдау."
    prompt_ru: "В приложенном артефакте «слайд с собственной иллюстрацией» обнаружено: изображение растянуто, обрезает смысловую деталь и не имеет пояснения. Что нужно сделать в первую очередь?"
    prompt_kk: "Тіркелген «өз иллюстрациясы бар слайд» артефактісінде мына мәселе анықталды: сурет созылған, мағыналы бөлшек қиылған және түсіндірмесі жоқ. Ең алдымен не істеу керек?"
    options_ru:
      - "Сохранить версию как есть: визуальная привлекательность важнее."
      - "Добавить декоративный элемент, не меняя содержание."
      - "Исправить указанную ошибку, повторно проверить, что пропорции сохранены, смысловой объект виден, источник или статус изображения понятен, и приложить версию до/после или иной проверяемый след."
      - "Удалить критерии проверки, чтобы ошибка не влияла на оценивание."
    options_kk:
      - "Нұсқаны өзгеріссіз сақтау: көрнекі тартымдылық маңыздырақ."
      - "Мазмұнды өзгертпей сәндік элемент қосу."
      - "Көрсетілген қатені түзетіп, пропорция сақталған, мағыналы нысан көрінеді, сурет көзі немесе мәртебесі түсінікті екенін қайта тексеру және дейін/кейін нұсқасын не басқа тексерілетін дәлелді тіркеу."
      - "Қате бағалауға әсер етпеуі үшін тексеру критерийлерін жою."
    correct_answer: "C"
    rationale_ru: "Сначала устраняется ошибка, влияющая на учебный результат или безопасность. Повторная проверка и доказательство изменения позволяют подтвердить выполнение."
    rationale_kk: "Алдымен оқу нәтижесіне немесе қауіпсіздікке әсер ететін қате түзетіледі. Қайта тексеру және өзгеріс дәлелі орындалуды растауға мүмкіндік береді."
    randomization:
      shuffle_options: true
