  method_kk: "Шағын тест қысқа тапсырмалар әрекетті түсінудің жарамды дәлелін бергенде ғана қолданылады."
instructions_ru: "Ответьте на три задания. Для вопроса об артефакте используйте собственную работу и удалите персональные данные учеников."
instructions_kk: "Үш тапсырмаға жауап беріңіз. Артефакт туралы сұрақта өз жұмысыңызды қолданыңыз және оқушылардың дербес деректерін жойыңыз."
questions:
  - id: "Q-L21-01"
    lesson_id: "L21"
    track: "presentations"
    type: "scenario_best_next_step"
    difficulty: "medium"
    learning_goal_ru: "Встроить собственные изображения в презентацию с корректной подписью и композицией."
    learning_goal_kk: "Өз суреттерін дұрыс қолтаңба және композициямен презентацияға енгізу."
    prompt_ru: "Учитель готовит материал для {grade} по предмету «{subject}». Нужно встроить собственные изображения в презентацию с корректной подписью и композицией; ограничение: {constraint}. Какой следующий шаг наиболее обоснован?"
    prompt_kk: "Мұғалім {grade} үшін «{subject}» пәнінен материал дайындап жатыр. Міндет: өз суреттерін дұрыс қолтаңба және композициямен презентацияға енгізу; шектеу: {constraint}. Келесі қадамдардың қайсысы ең негізді?"
    options_ru:
      - "Сразу опубликовать первый результат ИИ без проверки."
      - "Уточнить цель и ограничения, получить черновик, затем проверить, что пропорции сохранены, смысловой объект виден, источник или статус изображения понятен, и сохранить доказательство проверки."
      - "Попросить ИИ «сделать лучше», не уточняя, что именно должно измениться."
      - "Добавить реальные персональные данные учеников, чтобы ответ выглядел конкретнее."
    options_kk:
      - "ЖИ-дің алғашқы нәтижесін тексермей бірден жариялау."
      - "Мақсат пен шектеулерді нақтылап, нобай алу, содан кейін пропорция сақталған, мағыналы нысан көрінеді, сурет көзі немесе мәртебесі түсінікті екенін тексеріп, тексеру дәлелін сақтау."
      - "Нені өзгерту керегін нақтыламай, ЖИ-ден «жақсырақ жасауды» сұрау."
      - "Жауап нақты көрінуі үшін оқушылардың шынайы дербес деректерін қосу."
    correct_answer: "B"
    rationale_ru: "Вариант B связывает генерацию с целью, ограничениями и проверяемым критерием. Остальные варианты исключают проверку, дают неопределённую команду или нарушают безопасность."
    rationale_kk: "B нұсқасы генерацияны мақсатпен, шектеулермен және тексерілетін критериймен байланыстырады. Қалған нұсқалар тексеруді алып тастайды, анық емес бұйрық береді немесе қауіпсіздікті бұзады."
    randomization:
      shuffle_options: true
      parameter_slots:
        - name: "grade"
          values_ru:
            - "2 класс"
            - "5 класс"
            - "8 класс"
            - "11 класс"
          values_kk:
            - "2-сынып"
            - "5-сынып"
            - "8-сынып"
            - "11-сынып"
        - name: "subject"
