topic_ru: "Презентация со своими картинками"
topic_kk: "Өз суреттері бар презентация"
objective_ru: "Обновить презентацию собственными или лицензированными изображениями, сохранив смысл, подписи и доступность."
objective_kk: "Мағынаны, жазбаларды және қолжетімділікті сақтап, презентацияны өз немесе лицензияланған суреттермен жаңарту."
outcomes_ru:
  - "Выбирает изображение по учебной функции, а не декору."
  - "Фиксирует авторство, лицензию и альтернативный текст."
outcomes_kk:
  - "Суретті безендіру үшін емес, оқу қызметіне қарай таңдайды."
  - "Авторлықты, лицензияны және балама мәтінді тіркейді."
