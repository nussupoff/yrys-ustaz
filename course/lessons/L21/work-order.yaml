    - "кадрлау"
teacher_artifact:
  ru: "Обновлённая презентация минимум с тремя своими изображениями."
  kk: "Кемінде үш өз суреті енгізілген жаңартылған презентация."
writer_brief:
  output: "course/lessons/L21/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: лицензия, подпись, альтернативный текст, кадрирование. Маршрут: Отобрать изображения с понятными правами.; Вставить их вместо декоративных заглушек.; Добавить подписи и альтернативные описания.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: лицензия, сурет жазбасы, балама мәтін, кадрлау. Бағыт: Құқығы түсінікті суреттерді таңдау.; Оларды сәндік толтырғыштардың орнына енгізу.; Жазбалар мен балама сипаттамалар қосу.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Использованы минимум три изображения."
      kk: "Кемінде үш сурет қолданылған."
    - ru: "Права и источники зафиксированы."
      kk: "Құқықтар мен дереккөздер тіркелген."
    - ru: "Изображения поддерживают содержание."
      kk: "Суреттер мазмұнды қолдайды."
video_brief:
  output: "course/lessons/L21/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Отобрать изображения с понятными правами.; Вставить их вместо декоративных заглушек.; Добавить подписи и альтернативные описания.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Құқығы түсінікті суреттерді таңдау.; Оларды сәндік толтырғыштардың орнына енгізу.; Жазбалар мен балама сипаттамалар қосу.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L21/prompts.md"
    - "course/lessons/L21/assignment.md"
  prompt_ids:
    - "P-L21-01"
    - "P-L21-02"
  assignment_id: "A-L21-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Обновлённая презентация минимум с тремя своими изображениями. Шаги: Отобрать изображения с понятными правами.; Вставить их вместо декоративных заглушек.; Добавить подписи и альтернативные описания.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Кемінде үш өз суреті енгізілген жаңартылған презентация. Қадамдар: Құқығы түсінікті суреттерді таңдау.; Оларды сәндік толтырғыштардың орнына енгізу.; Жазбалар мен балама сипаттамалар қосу.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Использованы минимум три изображения."
      kk: "Кемінде үш сурет қолданылған."
    - ru: "Права и источники зафиксированы."
      kk: "Құқықтар мен дереккөздер тіркелген."
    - ru: "Изображения поддерживают содержание."
      kk: "Суреттер мазмұнды қолдайды."
assessment_brief:
  outputs:
    - "course/lessons/L21/quiz.yaml"
    - "course/lessons/L21/qa-report.md"
  question_ids:
    - "Q-L21-01"
    - "Q-L21-02"
    - "Q-L21-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Использованы минимум три изображения.; Права и источники зафиксированы.; Изображения поддерживают содержание.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Кемінде үш сурет қолданылған.; Құқықтар мен дереккөздер тіркелген.; Суреттер мазмұнды қолдайды.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Использованы минимум три изображения."
      kk: "Кемінде үш сурет қолданылған."
    - ru: "Права и источники зафиксированы."
      kk: "Құқықтар мен дереккөздер тіркелген."
    - ru: "Изображения поддерживают содержание."
      kk: "Суреттер мазмұнды қолдайды."
  mandatory_qa:
    - "RU/KK semantic parity"
    - "stable IDs"
    - "attachment opens"
    - "no student personal data"
    - "facts and answer keys checked"
    - "UI verified or dual markers retained"
    - "accessibility checked"
    - "QA PASS only"
attachment_type:
