  - "flow-map"
safety_notes:
  ru: "Использовать только обезличенные или синтетические данные. Не загружать ФИО, контакты, оценки, диагнозы, фотографии и голоса учеников. Проверять факты, возрастную уместность, авторские права и явно указывать роль ИИ. Не добавлять сбор данных, регистрацию или аналитику без явной педагогической необходимости и проверки политики."
  kk: "Тек иесіздендірілген немесе синтетикалық деректерді пайдалану. Оқушылардың аты-жөнін, байланысын, бағасын, диагнозын, фотосын және дауысын жүктемеу. Фактілерді, жасқа сәйкестікті, авторлық құқықты тексеріп, ЖИ рөлін ашық көрсету. Айқын педагогикалық қажеттілік пен саясат тексеруінсіз дерек жинауды, тіркелуді немесе аналитиканы қоспау."
