track: "F-building"
estimated_video_seconds: "120-180"
topic_ru: "Учебный сайт-платформа"
topic_kk: "Оқу сайт-платформасы"
objective_ru: "Собрать учебную платформу минимум из трёх связанных разделов и проверить полный путь пользователя."
objective_kk: "Кемінде үш байланысқан бөлімнен тұратын оқу платформасын құрып, пайдаланушының толық жолын тексеру."
outcomes_ru:
  - "Проектирует маршрут от входа к материалу и практике."
  - "Проверяет навигацию, состояния ошибок и доступность."
outcomes_kk:
  - "Кіруден материал мен практикаға дейінгі бағытты жобалайды."
  - "Навигацияны, қате күйлерін және қолжетімділікті тексереді."
prerequisites:
  - "L32"
  - "L33"
  - "L34"
technical_concepts:
  ru:
    - "информационная архитектура"
    - "пользовательский путь"
    - "раздел"
    - "состояние ошибки"
  kk:
    - "ақпараттық архитектура"
    - "пайдаланушы жолы"
    - "бөлім"
    - "қате күйі"
teacher_artifact:
  ru: "Рабочая платформа с тремя разделами и картой пользовательского пути."
  kk: "Үш бөлімі және пайдаланушы жолының картасы бар жұмыс істейтін платформа."
writer_brief:
  output: "course/lessons/L35/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: информационная архитектура, пользовательский путь, раздел, состояние ошибки. Маршрут: Определить три раздела и их связи.; Объединить материалы и тренажёр.; Пройти основной и ошибочный сценарии.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: ақпараттық архитектура, пайдаланушы жолы, бөлім, қате күйі. Бағыт: Үш бөлім мен олардың байланысын анықтау.; Материалдар мен жаттықтырғышты біріктіру.; Негізгі және қате сценарийлерден өту.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Есть минимум три раздела."
      kk: "Кемінде үш бөлім бар."
    - ru: "Основной путь завершается результатом."
      kk: "Негізгі жол нәтижемен аяқталады."
    - ru: "Ошибочные ссылки или пустые состояния обработаны."
      kk: "Қате сілтемелер немесе бос күйлер өңделген."
video_brief:
  output: "course/lessons/L35/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Определить три раздела и их связи.; Объединить материалы и тренажёр.; Пройти основной и ошибочный сценарии.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Үш бөлім мен олардың байланысын анықтау.; Материалдар мен жаттықтырғышты біріктіру.; Негізгі және қате сценарийлерден өту.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L35/prompts.md"
    - "course/lessons/L35/assignment.md"
  prompt_ids:
    - "P-L35-01"
    - "P-L35-02"
  assignment_id: "A-L35-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Рабочая платформа с тремя разделами и картой пользовательского пути. Шаги: Определить три раздела и их связи.; Объединить материалы и тренажёр.; Пройти основной и ошибочный сценарии.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Үш бөлімі және пайдаланушы жолының картасы бар жұмыс істейтін платформа. Қадамдар: Үш бөлім мен олардың байланысын анықтау.; Материалдар мен жаттықтырғышты біріктіру.; Негізгі және қате сценарийлерден өту.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Есть минимум три раздела."
      kk: "Кемінде үш бөлім бар."
    - ru: "Основной путь завершается результатом."
      kk: "Негізгі жол нәтижемен аяқталады."
    - ru: "Ошибочные ссылки или пустые состояния обработаны."
      kk: "Қате сілтемелер немесе бос күйлер өңделген."
assessment_brief:
  outputs:
    - "course/lessons/L35/quiz.yaml"
    - "course/lessons/L35/qa-report.md"
  question_ids:
    - "Q-L35-01"
    - "Q-L35-02"
    - "Q-L35-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Есть минимум три раздела.; Основной путь завершается результатом.; Ошибочные ссылки или пустые состояния обработаны.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Кемінде үш бөлім бар.; Негізгі жол нәтижемен аяқталады.; Қате сілтемелер немесе бос күйлер өңделген.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Есть минимум три раздела."
      kk: "Кемінде үш бөлім бар."
    - ru: "Основной путь завершается результатом."
      kk: "Негізгі жол нәтижемен аяқталады."
    - ru: "Ошибочные ссылки или пустые состояния обработаны."
      kk: "Қате сілтемелер немесе бос күйлер өңделген."
  mandatory_qa:
    - "RU/KK semantic parity"
    - "stable IDs"
    - "attachment opens"
    - "no student personal data"
    - "facts and answer keys checked"
    - "UI verified or dual markers retained"
    - "accessibility checked"
    - "QA PASS only"
attachment_type:
  - "link"
