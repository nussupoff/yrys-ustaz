teacher_artifact:
  ru: "Презентация и заполненная матрица «требование → доказательство»."
  kk: "Презентация және толтырылған «талап → дәлел» матрицасы."
writer_brief:
  output: "course/lessons/L24/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: техническое задание, ограничение, приёмочный критерий, контроль соответствия. Маршрут: Разбить ТЗ на атомарные требования.; Создать презентацию по структуре.; Для каждого требования указать слайд-доказательство.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: техникалық тапсырма, шектеу, қабылдау өлшемшарты, сәйкестікті бақылау. Бағыт: ТТ-ны жеке талаптарға бөлу.; Құрылым бойынша презентация жасау.; Әр талапқа дәлел болатын слайдты көрсету.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Все требования перечислены."
      kk: "Барлық талап тізімделген."
    - ru: "Для каждого есть доказательство."
      kk: "Әрқайсысына дәлел бар."
    - ru: "Невыполненные пункты не скрыты."
      kk: "Орындалмаған тармақтар жасырылмаған."
video_brief:
  output: "course/lessons/L24/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Разбить ТЗ на атомарные требования.; Создать презентацию по структуре.; Для каждого требования указать слайд-доказательство.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: ТТ-ны жеке талаптарға бөлу.; Құрылым бойынша презентация жасау.; Әр талапқа дәлел болатын слайдты көрсету.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L24/prompts.md"
    - "course/lessons/L24/assignment.md"
  prompt_ids:
    - "P-L24-01"
    - "P-L24-02"
  assignment_id: "A-L24-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Презентация и заполненная матрица «требование → доказательство». Шаги: Разбить ТЗ на атомарные требования.; Создать презентацию по структуре.; Для каждого требования указать слайд-доказательство.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Презентация және толтырылған «талап → дәлел» матрицасы. Қадамдар: ТТ-ны жеке талаптарға бөлу.; Құрылым бойынша презентация жасау.; Әр талапқа дәлел болатын слайдты көрсету.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
