objective_ru: "Создать презентацию по подробному ТЗ и доказать выполнение каждого ограничения чек-листом."
objective_kk: "Толық техникалық тапсырма бойынша презентация жасап, әр шектеудің орындалуын чек-парақпен дәлелдеу."
outcomes_ru:
