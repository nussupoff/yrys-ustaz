    - "course/lessons/L24/qa-report.md"
  question_ids:
    - "Q-L24-01"
    - "Q-L24-02"
    - "Q-L24-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Все требования перечислены.; Для каждого есть доказательство.; Невыполненные пункты не скрыты.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Барлық талап тізімделген.; Әрқайсысына дәлел бар.; Орындалмаған тармақтар жасырылмаған.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
