  question_ids:
    - "Q-L29-01"
    - "Q-L29-02"
    - "Q-L29-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Подписи соответствуют речи или действию.; Текст успевает читаться.; Контраст достаточен.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Жазулар сөйлеуге немесе әрекетке сәйкес.; Мәтінді оқуға уақыт жеткілікті.; Контраст жеткілікті.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
