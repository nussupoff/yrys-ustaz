teacher_artifact:
  ru: "Видео с синхронными подписями и текстовая расшифровка."
  kk: "Синхронды жазулары бар видео және мәтіндік транскрипт."
writer_brief:
  output: "course/lessons/L29/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: экранные подписи, субтитры, таймкод, контраст, безопасная зона. Маршрут: Подготовить точный текст.; Разбить его на короткие фразы.; Синхронизировать и проверить на обычном экране.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: экран жазулары, субтитрлер, таймкод, контраст, қауіпсіз аймақ. Бағыт: Дәл мәтін дайындау.; Оны қысқа тіркестерге бөлу.; Синхрондап, қалыпты экранда тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Подписи соответствуют речи или действию."
      kk: "Жазулар сөйлеуге немесе әрекетке сәйкес."
    - ru: "Текст успевает читаться."
      kk: "Мәтінді оқуға уақыт жеткілікті."
    - ru: "Контраст достаточен."
      kk: "Контраст жеткілікті."
video_brief:
  output: "course/lessons/L29/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Подготовить точный текст.; Разбить его на короткие фразы.; Синхронизировать и проверить на обычном экране.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Дәл мәтін дайындау.; Оны қысқа тіркестерге бөлу.; Синхрондап, қалыпты экранда тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L29/prompts.md"
    - "course/lessons/L29/assignment.md"
  prompt_ids:
    - "P-L29-01"
    - "P-L29-02"
  assignment_id: "A-L29-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Видео с синхронными подписями и текстовая расшифровка. Шаги: Подготовить точный текст.; Разбить его на короткие фразы.; Синхронизировать и проверить на обычном экране.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Синхронды жазулары бар видео және мәтіндік транскрипт. Қадамдар: Дәл мәтін дайындау.; Оны қысқа тіркестерге бөлу.; Синхрондап, қалыпты экранда тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
