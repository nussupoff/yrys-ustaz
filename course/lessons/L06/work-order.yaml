topic_ru: "Фактчекинг и токены"
topic_kk: "Фактчекинг және токендер"
objective_ru: "Найти одну проверяемую ошибку в ответе ИИ и составить план из трёх способов экономно уточнять запросы."
objective_kk: "ЖИ жауабынан бір тексерілетін қатені тауып, сұрауларды үнемді нақтылаудың үш тәсілінен тұратын жоспар құру."
outcomes_ru:
  - "Проверяет утверждение по надёжному источнику."
  - "Объясняет токен как условную единицу, а не слово."
outcomes_kk:
  - "Тұжырымды сенімді дереккөзбен тексереді."
  - "Токенді сөз емес, шартты бірлік ретінде түсіндіреді."
