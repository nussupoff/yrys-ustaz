teacher_artifact:
  ru: "Ошибка с источником и план экономии из трёх конкретных мер."
  kk: "Дереккөзі көрсетілген қате және үш нақты үнемдеу шарасы."
writer_brief:
  output: "course/lessons/L06/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: фактчекинг, источник, галлюцинация, токен, краткий контекст. Маршрут: Выделить проверяемое утверждение.; Сверить его с авторитетным источником.; Сократить повтор, контекст и требуемый формат без потери цели.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: фактчекинг, дереккөз, галлюцинация, токен, қысқа контекст. Бағыт: Тексерілетін тұжырымды белгілеу.; Оны беделді дереккөзбен салыстыру.; Мақсатты жоғалтпай қайталауды, контексті және форматты қысқарту.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Источник позволяет воспроизвести проверку."
      kk: "Дереккөз тексеруді қайталауға мүмкіндік береді."
    - ru: "Исправление отделено от исходного ответа."
      kk: "Түзету бастапқы жауаптан бөлек көрсетілген."
    - ru: "Указаны три меры экономии."
      kk: "Үш үнемдеу шарасы берілген."
video_brief:
  output: "course/lessons/L06/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Выделить проверяемое утверждение.; Сверить его с авторитетным источником.; Сократить повтор, контекст и требуемый формат без потери цели.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Тексерілетін тұжырымды белгілеу.; Оны беделді дереккөзбен салыстыру.; Мақсатты жоғалтпай қайталауды, контексті және форматты қысқарту.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L06/prompts.md"
    - "course/lessons/L06/assignment.md"
  prompt_ids:
    - "P-L06-01"
    - "P-L06-02"
  assignment_id: "A-L06-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Ошибка с источником и план экономии из трёх конкретных мер. Шаги: Выделить проверяемое утверждение.; Сверить его с авторитетным источником.; Сократить повтор, контекст и требуемый формат без потери цели.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Дереккөзі көрсетілген қате және үш нақты үнемдеу шарасы. Қадамдар: Тексерілетін тұжырымды белгілеу.; Оны беделді дереккөзбен салыстыру.; Мақсатты жоғалтпай қайталауды, контексті және форматты қысқарту.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Источник позволяет воспроизвести проверку."
      kk: "Дереккөз тексеруді қайталауға мүмкіндік береді."
    - ru: "Исправление отделено от исходного ответа."
      kk: "Түзету бастапқы жауаптан бөлек көрсетілген."
    - ru: "Указаны три меры экономии."
      kk: "Үш үнемдеу шарасы берілген."
assessment_brief:
  outputs:
    - "course/lessons/L06/quiz.yaml"
    - "course/lessons/L06/qa-report.md"
  question_ids:
    - "Q-L06-01"
    - "Q-L06-02"
    - "Q-L06-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Источник позволяет воспроизвести проверку.; Исправление отделено от исходного ответа.; Указаны три меры экономии.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Дереккөз тексеруді қайталауға мүмкіндік береді.; Түзету бастапқы жауаптан бөлек көрсетілген.; Үш үнемдеу шарасы берілген.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Источник позволяет воспроизвести проверку."
      kk: "Дереккөз тексеруді қайталауға мүмкіндік береді."
    - ru: "Исправление отделено от исходного ответа."
      kk: "Түзету бастапқы жауаптан бөлек көрсетілген."
    - ru: "Указаны три меры экономии."
      kk: "Үш үнемдеу шарасы берілген."
  mandatory_qa:
    - "RU/KK semantic parity"
    - "stable IDs"
    - "attachment opens"
    - "no student personal data"
    - "facts and answer keys checked"
    - "UI verified or dual markers retained"
    - "accessibility checked"
    - "QA PASS only"
attachment_type:
  - "text"
  - "md"
  - "pdf"
safety_notes:
  ru: "Использовать только обезличенные или синтетические данные. Не загружать ФИО, контакты, оценки, диагнозы, фотографии и голоса учеников. Проверять факты, возрастную уместность, авторские права и явно указывать роль ИИ. Не публиковать непроверенный ответ как учебный факт; сведения о лимитах и стоимости помечать как требующие проверки."
  kk: "Тек иесіздендірілген немесе синтетикалық деректерді пайдалану. Оқушылардың аты-жөнін, байланысын, бағасын, диагнозын, фотосын және дауысын жүктемеу. Фактілерді, жасқа сәйкестікті, авторлық құқықты тексеріп, ЖИ рөлін ашық көрсету. Тексерілмеген жауапты оқу фактісі ретінде жарияламау; лимит пен баға туралы мәліметті тексеруді қажет етеді деп белгілеу."
