            - "сабақ 40 минут"
            - "интернет әлсіз"
            - "жұптық жұмыс"
            - "баспа нұсқасы қажет"
      artifact_binding_ru: "Подставить тему и ограничения участника; при наличии запросить фрагмент его работы «переработанный слайд» и ссылаться на конкретное доказательство."
      artifact_binding_kk: "Қатысушының тақырыбы мен шектеулерін қою; бар болса, оның «қайта жасалған слайд» жұмысынан үзінді сұрап, нақты дәлелге сілтеу."
  - id: "Q-L22-02"
    lesson_id: "L22"
    track: "presentations"
    type: "error_detection"
    difficulty: "hard"
    learning_goal_ru: "Обнаружить критическую ошибку в артефакте «переработанный слайд» и выбрать исправление."
    learning_goal_kk: "«қайта жасалған слайд» артефактісіндегі маңызды қатені анықтап, түзетуді таңдау."
    prompt_ru: "В приложенном артефакте «переработанный слайд» обнаружено: текст читается на ноутбуке автора, но слишком мелок для класса. Что нужно сделать в первую очередь?"
    prompt_kk: "Тіркелген «қайта жасалған слайд» артефактісінде мына мәселе анықталды: мәтін автор ноутбугында оқылады, бірақ сынып үшін тым ұсақ. Ең алдымен не істеу керек?"
    options_ru:
      - "Сохранить версию как есть: визуальная привлекательность важнее."
      - "Добавить декоративный элемент, не меняя содержание."
      - "Исправить указанную ошибку, повторно проверить, что главный смысл заметен, текст читается с расстояния, декор не мешает, и приложить версию до/после или иной проверяемый след."
      - "Удалить критерии проверки, чтобы ошибка не влияла на оценивание."
    options_kk:
      - "Нұсқаны өзгеріссіз сақтау: көрнекі тартымдылық маңыздырақ."
      - "Мазмұнды өзгертпей сәндік элемент қосу."
      - "Көрсетілген қатені түзетіп, негізгі мағына көрінеді, мәтін қашықтан оқылады, безендіру кедергі келтірмейді екенін қайта тексеру және дейін/кейін нұсқасын не басқа тексерілетін дәлелді тіркеу."
      - "Қате бағалауға әсер етпеуі үшін тексеру критерийлерін жою."
    correct_answer: "C"
    rationale_ru: "Сначала устраняется ошибка, влияющая на учебный результат или безопасность. Повторная проверка и доказательство изменения позволяют подтвердить выполнение."
    rationale_kk: "Алдымен оқу нәтижесіне немесе қауіпсіздікке әсер ететін қате түзетіледі. Қайта тексеру және өзгеріс дәлелі орындалуды растауға мүмкіндік береді."
