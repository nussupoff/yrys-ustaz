teacher_artifact:
  ru: "Один слайд «было/стало» с пояснением трёх улучшений."
  kk: "Үш жақсартуы түсіндірілген бір «бұрын/кейін» слайды."
writer_brief:
  output: "course/lessons/L22/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: визуальная иерархия, выравнивание, контраст, плотность текста. Маршрут: Сохранить исходную версию.; Сократить и сгруппировать содержание.; Сравнить версии по трём критериям.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: визуалдық иерархия, туралау, контраст, мәтін тығыздығы. Бағыт: Бастапқы нұсқаны сақтау.; Мазмұнды қысқартып, топтастыру.; Нұсқаларды үш өлшемшартпен салыстыру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Обе версии видны."
      kk: "Екі нұсқа да көрінеді."
    - ru: "Объяснены минимум три изменения."
      kk: "Кемінде үш өзгеріс түсіндірілген."
    - ru: "Смысл и факты не искажены."
      kk: "Мағына мен фактілер бұрмаланбаған."
video_brief:
  output: "course/lessons/L22/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Сохранить исходную версию.; Сократить и сгруппировать содержание.; Сравнить версии по трём критериям.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Бастапқы нұсқаны сақтау.; Мазмұнды қысқартып, топтастыру.; Нұсқаларды үш өлшемшартпен салыстыру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
