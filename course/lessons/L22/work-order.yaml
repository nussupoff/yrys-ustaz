    - "Q-L22-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Обе версии видны.; Объяснены минимум три изменения.; Смысл и факты не искажены.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Екі нұсқа да көрінеді.; Кемінде үш өзгеріс түсіндірілген.; Мағына мен фактілер бұрмаланбаған.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
