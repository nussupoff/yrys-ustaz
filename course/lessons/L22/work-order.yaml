topic_ru: "Оформление слайда: было и стало"
topic_kk: "Слайдты безендіру: бұрын және кейін"
objective_ru: "Переработать один перегруженный слайд и объяснить минимум три наблюдаемых улучшения."
objective_kk: "Шамадан тыс жүктелген бір слайдты қайта жасап, кемінде үш байқалатын жақсартуды түсіндіру."
outcomes_ru:
  - "Применяет иерархию, выравнивание и контраст."
  - "Сохраняет исходный смысл при сокращении."
outcomes_kk:
  - "Иерархияны, туралауды және контрастты қолданады."
  - "Қысқарту кезінде бастапқы мағынаны сақтайды."
