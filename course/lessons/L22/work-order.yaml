  assignment_id: "A-L22-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Один слайд «было/стало» с пояснением трёх улучшений. Шаги: Сохранить исходную версию.; Сократить и сгруппировать содержание.; Сравнить версии по трём критериям.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Үш жақсартуы түсіндірілген бір «бұрын/кейін» слайды. Қадамдар: Бастапқы нұсқаны сақтау.; Мазмұнды қысқартып, топтастыру.; Нұсқаларды үш өлшемшартпен салыстыру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
