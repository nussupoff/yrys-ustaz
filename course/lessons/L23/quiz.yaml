            - "естествознание"
            - "история"
            - "язык"
          values_kk:
            - "математика"
            - "жаратылыстану"
            - "тарих"
            - "тіл"
        - name: "constraint"
          values_ru:
            - "урок 40 минут"
            - "слабый интернет"
            - "работа в парах"
            - "нужна печатная версия"
          values_kk:
            - "сабақ 40 минут"
            - "интернет әлсіз"
            - "жұптық жұмыс"
            - "баспа нұсқасы қажет"
      artifact_binding_ru: "Подставить тему и ограничения участника; при наличии запросить фрагмент его работы «комплект материалов урока» и ссылаться на конкретное доказательство."
      artifact_binding_kk: "Қатысушының тақырыбы мен шектеулерін қою; бар болса, оның «сабақ материалдарының жинағы» жұмысынан үзінді сұрап, нақты дәлелге сілтеу."
  - id: "Q-L23-02"
    lesson_id: "L23"
    track: "presentations"
    type: "error_detection"
    difficulty: "medium"
    learning_goal_ru: "Обнаружить критическую ошибку в артефакте «комплект материалов урока» и выбрать исправление."
    learning_goal_kk: "«сабақ материалдарының жинағы» артефактісіндегі маңызды қатені анықтап, түзетуді таңдау."
    prompt_ru: "В приложенном артефакте «комплект материалов урока» обнаружено: в презентации одно задание, а в раздатке и критериях оценивается другое. Что нужно сделать в первую очередь?"
    prompt_kk: "Тіркелген «сабақ материалдарының жинағы» артефактісінде мына мәселе анықталды: презентацияда бір тапсырма, ал үлестірме мен критерийде басқа әрекет бағаланады. Ең алдымен не істеу керек?"
    options_ru:
      - "Сохранить версию как есть: визуальная привлекательность важнее."
      - "Добавить декоративный элемент, не меняя содержание."
      - "Исправить указанную ошибку, повторно проверить, что цели, инструкции, артефакты и критерии совпадают во всех файлах, и приложить версию до/после или иной проверяемый след."
      - "Удалить критерии проверки, чтобы ошибка не влияла на оценивание."
    options_kk:
      - "Нұсқаны өзгеріссіз сақтау: көрнекі тартымдылық маңыздырақ."
      - "Мазмұнды өзгертпей сәндік элемент қосу."
      - "Көрсетілген қатені түзетіп, мақсаттар, нұсқаулар, артефактілер мен критерийлер барлық файлда сәйкес екенін қайта тексеру және дейін/кейін нұсқасын не басқа тексерілетін дәлелді тіркеу."
      - "Қате бағалауға әсер етпеуі үшін тексеру критерийлерін жою."
    correct_answer: "C"
    rationale_ru: "Сначала устраняется ошибка, влияющая на учебный результат или безопасность. Повторная проверка и доказательство изменения позволяют подтвердить выполнение."
    rationale_kk: "Алдымен оқу нәтижесіне немесе қауіпсіздікке әсер ететін қате түзетіледі. Қайта тексеру және өзгеріс дәлелі орындалуды растауға мүмкіндік береді."
