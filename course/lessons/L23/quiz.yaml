  method_kk: "Шағын тест қысқа тапсырмалар әрекетті түсінудің жарамды дәлелін бергенде ғана қолданылады."
instructions_ru: "Ответьте на три задания. Для вопроса об артефакте используйте собственную работу и удалите персональные данные учеников."
instructions_kk: "Үш тапсырмаға жауап беріңіз. Артефакт туралы сұрақта өз жұмысыңызды қолданыңыз және оқушылардың дербес деректерін жойыңыз."
questions:
  - id: "Q-L23-01"
    lesson_id: "L23"
    track: "presentations"
    type: "scenario_best_next_step"
    difficulty: "hard"
    learning_goal_ru: "Согласовать конспект, презентацию, раздатку и оценивание в одном комплекте."
    learning_goal_kk: "Конспект, презентация, үлестірме және бағалауды бір жинақта үйлестіру."
    prompt_ru: "Учитель готовит материал для {grade} по предмету «{subject}». Нужно согласовать конспект, презентацию, раздатку и оценивание в одном комплекте; ограничение: {constraint}. Какой следующий шаг наиболее обоснован?"
    prompt_kk: "Мұғалім {grade} үшін «{subject}» пәнінен материал дайындап жатыр. Міндет: конспект, презентация, үлестірме және бағалауды бір жинақта үйлестіру; шектеу: {constraint}. Келесі қадамдардың қайсысы ең негізді?"
    options_ru:
      - "Сразу опубликовать первый результат ИИ без проверки."
      - "Уточнить цель и ограничения, получить черновик, затем проверить, что цели, инструкции, артефакты и критерии совпадают во всех файлах, и сохранить доказательство проверки."
      - "Попросить ИИ «сделать лучше», не уточняя, что именно должно измениться."
      - "Добавить реальные персональные данные учеников, чтобы ответ выглядел конкретнее."
    options_kk:
      - "ЖИ-дің алғашқы нәтижесін тексермей бірден жариялау."
      - "Мақсат пен шектеулерді нақтылап, нобай алу, содан кейін мақсаттар, нұсқаулар, артефактілер мен критерийлер барлық файлда сәйкес екенін тексеріп, тексеру дәлелін сақтау."
      - "Нені өзгерту керегін нақтыламай, ЖИ-ден «жақсырақ жасауды» сұрау."
      - "Жауап нақты көрінуі үшін оқушылардың шынайы дербес деректерін қосу."
    correct_answer: "B"
    rationale_ru: "Вариант B связывает генерацию с целью, ограничениями и проверяемым критерием. Остальные варианты исключают проверку, дают неопределённую команду или нарушают безопасность."
    rationale_kk: "B нұсқасы генерацияны мақсатпен, шектеулермен және тексерілетін критериймен байланыстырады. Қалған нұсқалар тексеруді алып тастайды, анық емес бұйрық береді немесе қауіпсіздікті бұзады."
    randomization:
      shuffle_options: true
      parameter_slots:
        - name: "grade"
          values_ru:
            - "2 класс"
            - "5 класс"
            - "8 класс"
            - "11 класс"
          values_kk:
            - "2-сынып"
            - "5-сынып"
            - "8-сынып"
            - "11-сынып"
        - name: "subject"
