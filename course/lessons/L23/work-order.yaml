teacher_artifact:
  ru: "Архив или папка: конспект, раздатка и презентация."
  kk: "Архив немесе бума: конспект, үлестірме және презентация."
writer_brief:
  output: "course/lessons/L23/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: комплект урока, согласованность, версия, маршрут учителя. Маршрут: Зафиксировать общую цель и терминологию.; Собрать три обязательные части.; Пройти урок по материалам как пользователь.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: сабақ жинағы, үйлесімділік, нұсқа, мұғалім маршруты. Бағыт: Ортақ мақсат пен терминологияны бекіту.; Үш міндетті бөлікті жинау.; Материалдар бойынша сабақты пайдаланушы ретінде өту.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Присутствуют три части."
      kk: "Үш бөлік бар."
    - ru: "Инструкции и ответы согласованы."
      kk: "Нұсқаулар мен жауаптар үйлеседі."
    - ru: "Файлы открываются и названы понятно."
      kk: "Файлдар ашылады және түсінікті аталған."
video_brief:
  output: "course/lessons/L23/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Зафиксировать общую цель и терминологию.; Собрать три обязательные части.; Пройти урок по материалам как пользователь.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Ортақ мақсат пен терминологияны бекіту.; Үш міндетті бөлікті жинау.; Материалдар бойынша сабақты пайдаланушы ретінде өту.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L23/prompts.md"
    - "course/lessons/L23/assignment.md"
  prompt_ids:
    - "P-L23-01"
    - "P-L23-02"
  assignment_id: "A-L23-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Архив или папка: конспект, раздатка и презентация. Шаги: Зафиксировать общую цель и терминологию.; Собрать три обязательные части.; Пройти урок по материалам как пользователь.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Архив немесе бума: конспект, үлестірме және презентация. Қадамдар: Ортақ мақсат пен терминологияны бекіту.; Үш міндетті бөлікті жинау.; Материалдар бойынша сабақты пайдаланушы ретінде өту.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
