      kk: "Үш бөлік бар."
    - ru: "Инструкции и ответы согласованы."
      kk: "Нұсқаулар мен жауаптар үйлеседі."
    - ru: "Файлы открываются и названы понятно."
      kk: "Файлдар ашылады және түсінікті аталған."
assessment_brief:
  outputs:
    - "course/lessons/L23/quiz.yaml"
    - "course/lessons/L23/qa-report.md"
  question_ids:
    - "Q-L23-01"
    - "Q-L23-02"
    - "Q-L23-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Присутствуют три части.; Инструкции и ответы согласованы.; Файлы открываются и названы понятно.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Үш бөлік бар.; Нұсқаулар мен жауаптар үйлеседі.; Файлдар ашылады және түсінікті аталған.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Присутствуют три части."
      kk: "Үш бөлік бар."
    - ru: "Инструкции и ответы согласованы."
