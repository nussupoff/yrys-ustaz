topic_ru: "Полный комплект урока"
topic_kk: "Сабақтың толық жинағы"
objective_ru: "Собрать согласованный комплект из конспекта, раздатки и презентации для одной учебной цели."
objective_kk: "Бір оқу мақсатына арналған конспект, үлестірме және презентациядан тұратын үйлесімді жинақ құрастыру."
outcomes_ru:
  - "Проверяет соответствие всех частей одной цели."
  - "Устраняет противоречия в терминах, заданиях и ответах."
outcomes_kk:
  - "Барлық бөліктің бір мақсатқа сәйкестігін тексереді."
  - "Терминдердегі, тапсырмалардағы және жауаптардағы қайшылықтарды жояды."
