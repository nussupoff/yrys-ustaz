            - "жұптық жұмыс"
            - "баспа нұсқасы қажет"
      artifact_binding_ru: "Подставить тему и ограничения участника; при наличии запросить фрагмент его работы «страница учебных материалов» и ссылаться на конкретное доказательство."
      artifact_binding_kk: "Қатысушының тақырыбы мен шектеулерін қою; бар болса, оның «оқу материалдарының беті» жұмысынан үзінді сұрап, нақты дәлелге сілтеу."
  - id: "Q-L33-02"
    lesson_id: "L33"
    track: "games_sites"
    type: "error_detection"
    difficulty: "hard"
    learning_goal_ru: "Обнаружить критическую ошибку в артефакте «страница учебных материалов» и выбрать исправление."
    learning_goal_kk: "«оқу материалдарының беті» артефактісіндегі маңызды қатені анықтап, түзетуді таңдау."
    prompt_ru: "В приложенном артефакте «страница учебных материалов» обнаружено: файлы перечислены без описания, версии и указания, что с ними делать. Что нужно сделать в первую очередь?"
    prompt_kk: "Тіркелген «оқу материалдарының беті» артефактісінде мына мәселе анықталды: файлдар сипаттамасыз, нұсқасыз және олармен не істеу керегі көрсетілмей берілген. Ең алдымен не істеу керек?"
    options_ru:
      - "Сохранить версию как есть: визуальная привлекательность важнее."
      - "Добавить декоративный элемент, не меняя содержание."
      - "Исправить указанную ошибку, повторно проверить, что каждый материал имеет название, назначение, формат и рабочую ссылку, и приложить версию до/после или иной проверяемый след."
      - "Удалить критерии проверки, чтобы ошибка не влияла на оценивание."
    options_kk:
      - "Нұсқаны өзгеріссіз сақтау: көрнекі тартымдылық маңыздырақ."
      - "Мазмұнды өзгертпей сәндік элемент қосу."
      - "Көрсетілген қатені түзетіп, әр материалдың атауы, мақсаты, форматы және жұмыс істейтін сілтемесі бар екенін қайта тексеру және дейін/кейін нұсқасын не басқа тексерілетін дәлелді тіркеу."
      - "Қате бағалауға әсер етпеуі үшін тексеру критерийлерін жою."
    correct_answer: "C"
    rationale_ru: "Сначала устраняется ошибка, влияющая на учебный результат или безопасность. Повторная проверка и доказательство изменения позволяют подтвердить выполнение."
    rationale_kk: "Алдымен оқу нәтижесіне немесе қауіпсіздікке әсер ететін қате түзетіледі. Қайта тексеру және өзгеріс дәлелі орындалуды растауға мүмкіндік береді."
