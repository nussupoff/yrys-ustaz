      kk: "Сипаттама қажетті материалды таңдауға көмектеседі."
assessment_brief:
  outputs:
    - "course/lessons/L33/quiz.yaml"
    - "course/lessons/L33/qa-report.md"
  question_ids:
    - "Q-L33-01"
    - "Q-L33-02"
    - "Q-L33-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Есть минимум три материала.; Каждая ссылка открывается.; Описание помогает выбрать нужный материал.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Кемінде үш материал бар.; Әр сілтеме ашылады.; Сипаттама қажетті материалды таңдауға көмектеседі.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Есть минимум три материала."
      kk: "Кемінде үш материал бар."
    - ru: "Каждая ссылка открывается."
