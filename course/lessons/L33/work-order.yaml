teacher_artifact:
  ru: "Рабочая страница минимум с тремя материалами."
  kk: "Кемінде үш материалы бар жұмыс істейтін бет."
writer_brief:
  output: "course/lessons/L33/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: карточка ресурса, ссылка, права доступа, описание файла. Маршрут: Подготовить три безопасных материала.; Добавить название, назначение и формат каждого.; Проверить ссылки без авторизации автора.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: ресурс карточкасы, сілтеме, қолжетімділік құқығы, файл сипаттамасы. Бағыт: Үш қауіпсіз материал дайындау.; Әрқайсысының атауын, мақсатын және форматын қосу.; Сілтемелерді автор тіркелгісінсіз тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Есть минимум три материала."
      kk: "Кемінде үш материал бар."
    - ru: "Каждая ссылка открывается."
      kk: "Әр сілтеме ашылады."
    - ru: "Описание помогает выбрать нужный материал."
      kk: "Сипаттама қажетті материалды таңдауға көмектеседі."
video_brief:
  output: "course/lessons/L33/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Подготовить три безопасных материала.; Добавить название, назначение и формат каждого.; Проверить ссылки без авторизации автора.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Үш қауіпсіз материал дайындау.; Әрқайсысының атауын, мақсатын және форматын қосу.; Сілтемелерді автор тіркелгісінсіз тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L33/prompts.md"
    - "course/lessons/L33/assignment.md"
  prompt_ids:
    - "P-L33-01"
    - "P-L33-02"
  assignment_id: "A-L33-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Рабочая страница минимум с тремя материалами. Шаги: Подготовить три безопасных материала.; Добавить название, назначение и формат каждого.; Проверить ссылки без авторизации автора.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Кемінде үш материалы бар жұмыс істейтін бет. Қадамдар: Үш қауіпсіз материал дайындау.; Әрқайсысының атауын, мақсатын және форматын қосу.; Сілтемелерді автор тіркелгісінсіз тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
