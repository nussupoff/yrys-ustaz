objective_ru: "Создать готовый к печати комплект карточек с понятной инструкцией, нумерацией и местом для ответа."
objective_kk: "Түсінікті нұсқауы, нөмірленуі және жауап орны бар баспаға дайын карточкалар жинағын жасау."
