teacher_artifact:
  ru: "Файл минимум с четырьмя печатными карточками."
  kk: "Кемінде төрт баспа карточкасы бар файл."
writer_brief:
  output: "course/lessons/L11/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: раздатка, макет, поля печати, визуальная иерархия. Маршрут: Сократить инструкцию до одного действия.; Разместить карточки в единой сетке.; Проверить масштаб, поля и место для ответа.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: үлестірме, макет, баспа жиектері, визуалдық иерархия. Бағыт: Нұсқауды бір әрекетке дейін қысқарту.; Карточкаларды біркелкі торға орналастыру.; Масштабты, жиектерді және жауап орнын тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Карточки пронумерованы."
      kk: "Карточкалар нөмірленген."
    - ru: "Текст читается в печатном масштабе."
      kk: "Мәтін баспа өлшемінде оқылады."
    - ru: "Инструкция и ожидаемый ответ однозначны."
      kk: "Нұсқау мен күтілетін жауап бірмәнді."
video_brief:
  output: "course/lessons/L11/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Сократить инструкцию до одного действия.; Разместить карточки в единой сетке.; Проверить масштаб, поля и место для ответа.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Нұсқауды бір әрекетке дейін қысқарту.; Карточкаларды біркелкі торға орналастыру.; Масштабты, жиектерді және жауап орнын тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L11/prompts.md"
    - "course/lessons/L11/assignment.md"
  prompt_ids:
    - "P-L11-01"
    - "P-L11-02"
  assignment_id: "A-L11-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Файл минимум с четырьмя печатными карточками. Шаги: Сократить инструкцию до одного действия.; Разместить карточки в единой сетке.; Проверить масштаб, поля и место для ответа.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Кемінде төрт баспа карточкасы бар файл. Қадамдар: Нұсқауды бір әрекетке дейін қысқарту.; Карточкаларды біркелкі торға орналастыру.; Масштабты, жиектерді және жауап орнын тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Карточки пронумерованы."
      kk: "Карточкалар нөмірленген."
    - ru: "Текст читается в печатном масштабе."
      kk: "Мәтін баспа өлшемінде оқылады."
    - ru: "Инструкция и ожидаемый ответ однозначны."
      kk: "Нұсқау мен күтілетін жауап бірмәнді."
assessment_brief:
  outputs:
    - "course/lessons/L11/quiz.yaml"
    - "course/lessons/L11/qa-report.md"
  question_ids:
    - "Q-L11-01"
    - "Q-L11-02"
    - "Q-L11-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Карточки пронумерованы.; Текст читается в печатном масштабе.; Инструкция и ожидаемый ответ однозначны.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Карточкалар нөмірленген.; Мәтін баспа өлшемінде оқылады.; Нұсқау мен күтілетін жауап бірмәнді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Карточки пронумерованы."
      kk: "Карточкалар нөмірленген."
    - ru: "Текст читается в печатном масштабе."
      kk: "Мәтін баспа өлшемінде оқылады."
    - ru: "Инструкция и ожидаемый ответ однозначны."
      kk: "Нұсқау мен күтілетін жауап бірмәнді."
