    - "course/lessons/L28/quiz.yaml"
    - "course/lessons/L28/qa-report.md"
  question_ids:
    - "Q-L28-01"
    - "Q-L28-02"
    - "Q-L28-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Использовано минимум три клипа.; Порядок понятен.; Нет резких случайных скачков звука.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Кемінде үш клип қолданылған.; Реті түсінікті.; Дыбыста кездейсоқ күрт секіріс жоқ.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Использовано минимум три клипа."
