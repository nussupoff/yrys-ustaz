estimated_video_seconds: "120-180"
topic_ru: "Склейка роликов"
topic_kk: "Роликтерді біріктіру"
objective_ru: "Собрать несколько клипов в один ролик с логичным порядком, аккуратными переходами и единым звуком."
objective_kk: "Бірнеше клипті логикалық реті, ұқыпты ауысулары және біркелкі дыбысы бар бір роликке біріктіру."
outcomes_ru:
  - "Управляет порядком и длительностью фрагментов."
  - "Проверяет переходы, звук и отсутствие случайных кадров."
outcomes_kk:
  - "Фрагменттердің реті мен ұзақтығын басқарады."
  - "Ауысуларды, дыбысты және кездейсоқ кадрлардың жоқтығын тексереді."
prerequisites:
  - "L25"
  - "L27"
technical_concepts:
  ru:
    - "монтажная шкала"
    - "переход"
    - "обрезка"
    - "уровень звука"
  kk:
    - "таймлайн"
    - "ауысу"
    - "қию"
    - "дыбыс деңгейі"
teacher_artifact:
  ru: "Один смонтированный ролик минимум из трёх клипов."
  kk: "Кемінде үш клиптен монтаждалған бір ролик."
writer_brief:
  output: "course/lessons/L28/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: монтажная шкала, переход, обрезка, уровень звука. Маршрут: Расположить клипы по смыслу.; Обрезать пустые начала и окончания.; Выровнять переходы и громкость.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: таймлайн, ауысу, қию, дыбыс деңгейі. Бағыт: Клиптерді мағынасына қарай орналастыру.; Бос басталуы мен аяқталуын қию.; Ауысулар мен дыбыс деңгейін теңестіру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Использовано минимум три клипа."
      kk: "Кемінде үш клип қолданылған."
    - ru: "Порядок понятен."
      kk: "Реті түсінікті."
    - ru: "Нет резких случайных скачков звука."
      kk: "Дыбыста кездейсоқ күрт секіріс жоқ."
video_brief:
  output: "course/lessons/L28/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Расположить клипы по смыслу.; Обрезать пустые начала и окончания.; Выровнять переходы и громкость.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Клиптерді мағынасына қарай орналастыру.; Бос басталуы мен аяқталуын қию.; Ауысулар мен дыбыс деңгейін теңестіру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L28/prompts.md"
    - "course/lessons/L28/assignment.md"
  prompt_ids:
    - "P-L28-01"
    - "P-L28-02"
  assignment_id: "A-L28-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Один смонтированный ролик минимум из трёх клипов. Шаги: Расположить клипы по смыслу.; Обрезать пустые начала и окончания.; Выровнять переходы и громкость.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Кемінде үш клиптен монтаждалған бір ролик. Қадамдар: Клиптерді мағынасына қарай орналастыру.; Бос басталуы мен аяқталуын қию.; Ауысулар мен дыбыс деңгейін теңестіру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
