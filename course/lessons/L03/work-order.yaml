      kk: "Тапсырма бірдей."
    - ru: "Критерии применены к обоим вариантам."
      kk: "Өлшемшарттар екі нұсқаға да қолданылған."
    - ru: "Выбор подтверждён примерами из результатов."
      kk: "Таңдау нәтижелерден алынған мысалдармен дәлелденген."
assessment_brief:
  outputs:
    - "course/lessons/L03/quiz.yaml"
    - "course/lessons/L03/qa-report.md"
  question_ids:
    - "Q-L03-01"
    - "Q-L03-02"
    - "Q-L03-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Задача одинакова.; Критерии применены к обоим вариантам.; Выбор подтверждён примерами из результатов.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Тапсырма бірдей.; Өлшемшарттар екі нұсқаға да қолданылған.; Таңдау нәтижелерден алынған мысалдармен дәлелденген.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Задача одинакова."
      kk: "Тапсырма бірдей."
    - ru: "Критерии применены к обоим вариантам."
      kk: "Өлшемшарттар екі нұсқаға да қолданылған."
    - ru: "Выбор подтверждён примерами из результатов."
