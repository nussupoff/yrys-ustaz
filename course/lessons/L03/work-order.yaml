teacher_artifact:
  ru: "Таблица сравнения двух результатов и обоснованный выбор."
  kk: "Екі нәтижені салыстыру кестесі және негізделген таңдау."
writer_brief:
  output: "course/lessons/L03/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: модель, сравнительный критерий, вариант, ограничение модели. Маршрут: Выбрать одну безопасную задачу.; Получить два результата без изменения исходных условий.; Оценить оба результата по трём критериям.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: модель, салыстыру өлшемшарты, нұсқа, модель шектеуі. Бағыт: Бір қауіпсіз тапсырманы таңдау.; Бастапқы шарттарды өзгертпей екі нәтиже алу.; Екі нәтижені үш өлшемшартпен бағалау.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Задача одинакова."
      kk: "Тапсырма бірдей."
    - ru: "Критерии применены к обоим вариантам."
      kk: "Өлшемшарттар екі нұсқаға да қолданылған."
    - ru: "Выбор подтверждён примерами из результатов."
      kk: "Таңдау нәтижелерден алынған мысалдармен дәлелденген."
video_brief:
  output: "course/lessons/L03/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Выбрать одну безопасную задачу.; Получить два результата без изменения исходных условий.; Оценить оба результата по трём критериям.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Бір қауіпсіз тапсырманы таңдау.; Бастапқы шарттарды өзгертпей екі нәтиже алу.; Екі нәтижені үш өлшемшартпен бағалау.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L03/prompts.md"
    - "course/lessons/L03/assignment.md"
  prompt_ids:
    - "P-L03-01"
    - "P-L03-02"
  assignment_id: "A-L03-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Таблица сравнения двух результатов и обоснованный выбор. Шаги: Выбрать одну безопасную задачу.; Получить два результата без изменения исходных условий.; Оценить оба результата по трём критериям.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Екі нәтижені салыстыру кестесі және негізделген таңдау. Қадамдар: Бір қауіпсіз тапсырманы таңдау.; Бастапқы шарттарды өзгертпей екі нәтиже алу.; Екі нәтижені үш өлшемшартпен бағалау.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
