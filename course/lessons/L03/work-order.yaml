topic_kk: "Әртүрлі модельдер және нәтижелерді салыстыру"
objective_ru: "Выполнить одну учебную задачу двумя доступными способами и выбрать результат по единым критериям."
objective_kk: "Бір оқу тапсырмасын қолжетімді екі тәсілмен орындап, нәтижені ортақ өлшемшарттар бойынша таңдау."
outcomes_ru:
  - "Сравнивает результаты по точности, ясности и полезности."
  - "Не приписывает модели возможности без проверки."
outcomes_kk:
  - "Нәтижелерді дәлдік, түсініктілік және пайдалылық бойынша салыстырады."
  - "Тексерусіз модельге мүмкіндік телімейді."
