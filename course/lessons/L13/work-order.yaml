  - "Проверяет вычисления на выборке строк."
  - "Формулирует выводы без диагностики отдельных учеников."
outcomes_kk:
  - "Есептеулерді жолдар үлгісімен тексереді."
  - "Жекелеген оқушыларға диагноз қоймай қорытынды жасайды."
