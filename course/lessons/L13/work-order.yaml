teacher_artifact:
  ru: "Аналитическая записка с тремя наблюдениями, двумя гипотезами и планом проверки."
  kk: "Үш бақылауы, екі болжамы және тексеру жоспары бар талдамалық жазба."
writer_brief:
  output: "course/lessons/L13/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: табличные данные, агрегация, наблюдение, гипотеза, выброс. Маршрут: Подготовить синтетическую или обезличенную таблицу.; Проверить суммы и доли вручную.; Разделить факты, гипотезы и следующие действия.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: кестелік деректер, агрегация, бақылау, болжам, ауытқыма мән. Бағыт: Синтетикалық немесе иесіздендірілген кесте дайындау.; Қосындылар мен үлестерді қолмен тексеру.; Фактілерді, болжамдарды және келесі әрекеттерді бөлу.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Нет идентификаторов."
      kk: "Сәйкестендіргіш жоқ."
    - ru: "Числа воспроизводимы."
      kk: "Сандарды қайта есептеуге болады."
    - ru: "Гипотезы не представлены как доказанные причины."
      kk: "Болжамдар дәлелденген себеп ретінде берілмеген."
video_brief:
  output: "course/lessons/L13/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Подготовить синтетическую или обезличенную таблицу.; Проверить суммы и доли вручную.; Разделить факты, гипотезы и следующие действия.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Синтетикалық немесе иесіздендірілген кесте дайындау.; Қосындылар мен үлестерді қолмен тексеру.; Фактілерді, болжамдарды және келесі әрекеттерді бөлу.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L13/prompts.md"
    - "course/lessons/L13/assignment.md"
  prompt_ids:
    - "P-L13-01"
    - "P-L13-02"
  assignment_id: "A-L13-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Аналитическая записка с тремя наблюдениями, двумя гипотезами и планом проверки. Шаги: Подготовить синтетическую или обезличенную таблицу.; Проверить суммы и доли вручную.; Разделить факты, гипотезы и следующие действия.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Үш бақылауы, екі болжамы және тексеру жоспары бар талдамалық жазба. Қадамдар: Синтетикалық немесе иесіздендірілген кесте дайындау.; Қосындылар мен үлестерді қолмен тексеру.; Фактілерді, болжамдарды және келесі әрекеттерді бөлу.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
