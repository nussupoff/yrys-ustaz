      kk: "Сәйкестендіргіш жоқ."
    - ru: "Числа воспроизводимы."
      kk: "Сандарды қайта есептеуге болады."
    - ru: "Гипотезы не представлены как доказанные причины."
      kk: "Болжамдар дәлелденген себеп ретінде берілмеген."
assessment_brief:
