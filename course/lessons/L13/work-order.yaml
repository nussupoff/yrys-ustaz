    - "course/lessons/L13/qa-report.md"
  question_ids:
    - "Q-L13-01"
    - "Q-L13-02"
    - "Q-L13-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Нет идентификаторов.; Числа воспроизводимы.; Гипотезы не представлены как доказанные причины.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Сәйкестендіргіш жоқ.; Сандарды қайта есептеуге болады.; Болжамдар дәлелденген себеп ретінде берілмеген.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Нет идентификаторов."
      kk: "Сәйкестендіргіш жоқ."
    - ru: "Числа воспроизводимы."
      kk: "Сандарды қайта есептеуге болады."
