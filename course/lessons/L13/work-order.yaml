safety_notes:
  ru: "Использовать только обезличенные или синтетические данные. Не загружать ФИО, контакты, оценки, диагнозы, фотографии и голоса учеников. Проверять факты, возрастную уместность, авторские права и явно указывать роль ИИ. Работать с агрегатами; не делать медицинских, психологических или дисциплинарных выводов."
  kk: "Тек иесіздендірілген немесе синтетикалық деректерді пайдалану. Оқушылардың аты-жөнін, байланысын, бағасын, диагнозын, фотосын және дауысын жүктемеу. Фактілерді, жасқа сәйкестікті, авторлық құқықты тексеріп, ЖИ рөлін ашық көрсету. Жиынтық көрсеткіштермен жұмыс істеу; медициналық, психологиялық немесе тәртіптік қорытынды жасамау."
