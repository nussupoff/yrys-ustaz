topic_kk: "Иесіздендірілген кестелерді талдау"
objective_ru: "Проанализировать обезличенную учебную таблицу и отделить вычисленные факты от педагогических гипотез."
objective_kk: "Иесіздендірілген оқу кестесін талдап, есептелген фактілерді педагогикалық болжамдардан ажырату."
