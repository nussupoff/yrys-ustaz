  ru: "Презентация ровно из семи слайдов."
  kk: "Дәл жеті слайдтан тұратын презентация."
writer_brief:
  output: "course/lessons/L20/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: структура презентации, слайд, одна мысль, заметки докладчика. Маршрут: Задать аудиторию, цель и длительность показа.; Распределить содержание по семи функциям слайдов.; Проверить логику и объём текста.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: презентация құрылымы, слайд, бір ой, баяндамашы жазбалары. Бағыт: Аудиторияны, мақсатты және көрсету ұзақтығын беру.; Мазмұнды жеті слайд қызметіне бөлу.; Логика мен мәтін көлемін тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Ровно семь слайдов."
      kk: "Дәл жеті слайд."
    - ru: "На каждом слайде одна главная мысль."
      kk: "Әр слайдта бір негізгі ой."
    - ru: "Финальный слайд проверяет понимание."
      kk: "Соңғы слайд түсінуді тексереді."
video_brief:
  output: "course/lessons/L20/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Задать аудиторию, цель и длительность показа.; Распределить содержание по семи функциям слайдов.; Проверить логику и объём текста.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Аудиторияны, мақсатты және көрсету ұзақтығын беру.; Мазмұнды жеті слайд қызметіне бөлу.; Логика мен мәтін көлемін тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L20/prompts.md"
    - "course/lessons/L20/assignment.md"
  prompt_ids:
    - "P-L20-01"
    - "P-L20-02"
  assignment_id: "A-L20-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Презентация ровно из семи слайдов. Шаги: Задать аудиторию, цель и длительность показа.; Распределить содержание по семи функциям слайдов.; Проверить логику и объём текста.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Дәл жеті слайдтан тұратын презентация. Қадамдар: Аудиторияны, мақсатты және көрсету ұзақтығын беру.; Мазмұнды жеті слайд қызметіне бөлу.; Логика мен мәтін көлемін тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
