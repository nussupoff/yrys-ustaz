objective_ru: "Создать презентацию из семи слайдов с логической последовательностью и одной основной мыслью на слайд."
objective_kk: "Логикалық реті және әр слайдта бір негізгі ойы бар жеті слайдтық презентация жасау."
outcomes_ru:
  - "Строит структуру от цели к проверке понимания."
  - "Сокращает текст до экранного формата."
outcomes_kk:
  - "Құрылымды мақсаттан түсінуді тексеруге дейін құрады."
  - "Мәтінді экран форматына дейін қысқартады."
