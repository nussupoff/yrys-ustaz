safety_notes:
  ru: "Использовать только обезличенные или синтетические данные. Не загружать ФИО, контакты, оценки, диагнозы, фотографии и голоса учеников. Проверять факты, возрастную уместность, авторские права и явно указывать роль ИИ. Названия режимов создания и экспорта презентаций помечать [НУЖНА ПРОВЕРКА]/[ТЕКСЕРУ ҚАЖЕТ]."
  kk: "Тек иесіздендірілген немесе синтетикалық деректерді пайдалану. Оқушылардың аты-жөнін, байланысын, бағасын, диагнозын, фотосын және дауысын жүктемеу. Фактілерді, жасқа сәйкестікті, авторлық құқықты тексеріп, ЖИ рөлін ашық көрсету. Презентация жасау және экспорт режимдерінің атауын [НУЖНА ПРОВЕРКА]/[ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
