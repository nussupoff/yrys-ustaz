    - "course/lessons/L20/qa-report.md"
  question_ids:
    - "Q-L20-01"
    - "Q-L20-02"
    - "Q-L20-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Ровно семь слайдов.; На каждом слайде одна главная мысль.; Финальный слайд проверяет понимание.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Дәл жеті слайд.; Әр слайдта бір негізгі ой.; Соңғы слайд түсінуді тексереді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
