      kk: "Дәл жеті слайд."
    - ru: "На каждом слайде одна главная мысль."
      kk: "Әр слайдта бір негізгі ой."
    - ru: "Финальный слайд проверяет понимание."
      kk: "Соңғы слайд түсінуді тексереді."
assessment_brief:
