      kk: "Жауаптар кілттермен сәйкес."
    - ru: "Обратная связь объясняет, а не только оценивает."
      kk: "Кері байланыс тек бағаламай, түсіндіреді."
assessment_brief:
  outputs:
    - "course/lessons/L30/quiz.yaml"
    - "course/lessons/L30/qa-report.md"
  question_ids:
    - "Q-L30-01"
    - "Q-L30-02"
    - "Q-L30-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Минимум пять вопросов.; Ответы совпадают с ключами.; Обратная связь объясняет, а не только оценивает.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Кемінде бес сұрақ.; Жауаптар кілттермен сәйкес.; Кері байланыс тек бағаламай, түсіндіреді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Минимум пять вопросов."
      kk: "Кемінде бес сұрақ."
    - ru: "Ответы совпадают с ключами."
      kk: "Жауаптар кілттермен сәйкес."
    - ru: "Обратная связь объясняет, а не только оценивает."
      kk: "Кері байланыс тек бағаламай, түсіндіреді."
  mandatory_qa:
