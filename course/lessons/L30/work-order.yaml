teacher_artifact:
  ru: "Ссылка или файл игры-викторины с минимум пятью вопросами."
  kk: "Кемінде бес сұрағы бар ойын-викторина сілтемесі немесе файлы."
writer_brief:
  output: "course/lessons/L30/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: интерактив, состояние ответа, обратная связь, счёт. Маршрут: Перенести проверенные вопросы.; Добавить реакцию на правильный и неправильный ответ.; Пройти все вопросы как пользователь.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: интерактив, жауап күйі, кері байланыс, ұпай. Бағыт: Тексерілген сұрақтарды енгізу.; Дұрыс және қате жауапқа реакция қосу.; Барлық сұрақты пайдаланушы ретінде өту.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Минимум пять вопросов."
      kk: "Кемінде бес сұрақ."
    - ru: "Ответы совпадают с ключами."
      kk: "Жауаптар кілттермен сәйкес."
    - ru: "Обратная связь объясняет, а не только оценивает."
      kk: "Кері байланыс тек бағаламай, түсіндіреді."
video_brief:
  output: "course/lessons/L30/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Перенести проверенные вопросы.; Добавить реакцию на правильный и неправильный ответ.; Пройти все вопросы как пользователь.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Тексерілген сұрақтарды енгізу.; Дұрыс және қате жауапқа реакция қосу.; Барлық сұрақты пайдаланушы ретінде өту.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L30/prompts.md"
    - "course/lessons/L30/assignment.md"
  prompt_ids:
    - "P-L30-01"
    - "P-L30-02"
  assignment_id: "A-L30-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Ссылка или файл игры-викторины с минимум пятью вопросами. Шаги: Перенести проверенные вопросы.; Добавить реакцию на правильный и неправильный ответ.; Пройти все вопросы как пользователь.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Кемінде бес сұрағы бар ойын-викторина сілтемесі немесе файлы. Қадамдар: Тексерілген сұрақтарды енгізу.; Дұрыс және қате жауапқа реакция қосу.; Барлық сұрақты пайдаланушы ретінде өту.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
