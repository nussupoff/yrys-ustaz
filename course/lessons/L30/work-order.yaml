objective_ru: "Создать работающую игру-викторину с корректными ответами и объясняющей обратной связью."
objective_kk: "Дұрыс жауаптары және түсіндіретін кері байланысы бар жұмыс істейтін ойын-викторина жасау."
outcomes_ru:
  - "Связывает вопросы с целью."
  - "Проверяет каждый маршрут правильного и неправильного ответа."
outcomes_kk:
  - "Сұрақтарды мақсатпен байланыстырады."
  - "Дұрыс және қате жауаптың әр бағытын тексереді."
