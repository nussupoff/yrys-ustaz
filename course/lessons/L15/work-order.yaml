    - "визуалдық иерархия"
teacher_artifact:
  ru: "Пять карточек в одном файле или архиве."
  kk: "Бір файлдағы немесе архивтегі бес карточка."
writer_brief:
  output: "course/lessons/L15/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: серия, шаблон, нумерация, визуальная иерархия. Маршрут: Задать общий шаблон.; Распределить пять элементов содержания.; Проверить номера, стиль и читаемость.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: серия, үлгі, нөмірлеу, визуалдық иерархия. Бағыт: Ортақ үлгіні беру.; Мазмұнның бес элементін бөлу.; Нөмірлерді, стильді және оқылымдылықты тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Ровно пять карточек."
      kk: "Дәл бес карточка бар."
    - ru: "Нумерация и порядок ясны."
      kk: "Нөмірлеу мен реті түсінікті."
    - ru: "Все карточки используют одну систему."
      kk: "Барлық карточка бір жүйені қолданады."
video_brief:
  output: "course/lessons/L15/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Задать общий шаблон.; Распределить пять элементов содержания.; Проверить номера, стиль и читаемость.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Ортақ үлгіні беру.; Мазмұнның бес элементін бөлу.; Нөмірлерді, стильді және оқылымдылықты тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L15/prompts.md"
    - "course/lessons/L15/assignment.md"
  prompt_ids:
    - "P-L15-01"
    - "P-L15-02"
  assignment_id: "A-L15-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Пять карточек в одном файле или архиве. Шаги: Задать общий шаблон.; Распределить пять элементов содержания.; Проверить номера, стиль и читаемость.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Бір файлдағы немесе архивтегі бес карточка. Қадамдар: Ортақ үлгіні беру.; Мазмұнның бес элементін бөлу.; Нөмірлерді, стильді және оқылымдылықты тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
