topic_ru: "Пять дидактических карточек"
topic_kk: "Бес дидактикалық карточка"
objective_ru: "Создать серию из пяти пронумерованных карточек с единым макетом и отдельной учебной функцией каждой карточки."
objective_kk: "Біркелкі макеті бар, әрқайсысы жеке оқу қызметін атқаратын бес нөмірленген карточка сериясын жасау."
outcomes_ru:
  - "Сохраняет визуальную систему серии."
  - "Проверяет последовательность и полноту комплекта."
outcomes_kk:
  - "Серияның визуалдық жүйесін сақтайды."
  - "Жинақтың реттілігі мен толықтығын тексереді."
