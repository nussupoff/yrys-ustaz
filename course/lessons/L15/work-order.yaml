      kk: "Дәл бес карточка бар."
    - ru: "Нумерация и порядок ясны."
      kk: "Нөмірлеу мен реті түсінікті."
    - ru: "Все карточки используют одну систему."
      kk: "Барлық карточка бір жүйені қолданады."
assessment_brief:
  outputs:
    - "course/lessons/L15/quiz.yaml"
    - "course/lessons/L15/qa-report.md"
  question_ids:
    - "Q-L15-01"
    - "Q-L15-02"
    - "Q-L15-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Ровно пять карточек.; Нумерация и порядок ясны.; Все карточки используют одну систему.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Дәл бес карточка бар.; Нөмірлеу мен реті түсінікті.; Барлық карточка бір жүйені қолданады.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Ровно пять карточек."
      kk: "Дәл бес карточка бар."
    - ru: "Нумерация и порядок ясны."
      kk: "Нөмірлеу мен реті түсінікті."
    - ru: "Все карточки используют одну систему."
      kk: "Барлық карточка бір жүйені қолданады."
