teacher_artifact:
  ru: "Пара «до/после» с разметкой четырёх частей и двумя результатами."
  kk: "Төрт бөлігі белгіленген «бұрын/кейін» жұбы және екі нәтиже."
writer_brief:
  output: "course/lessons/L04/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: Р-З-К-Ф, Р-Т-К-Ф, контекст, формат результата. Маршрут: Запустить слабый запрос.; Добавить роль, задачу, контекст и формат.; Сравнить результаты по конкретности и пригодности.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: Р-З-К-Ф, Р-Т-К-Ф, контекст, нәтиже форматы. Бағыт: Әлсіз сұрауды орындау.; Рөл, тапсырма, контекст және формат қосу.; Нәтижелерді нақтылық пен жарамдылық бойынша салыстыру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Все четыре части отмечены."
      kk: "Төрт бөлік те белгіленген."
    - ru: "Улучшение наблюдаемо."
      kk: "Жақсару байқалады."
    - ru: "Исходная учебная цель не изменилась."
      kk: "Бастапқы оқу мақсаты өзгермеген."
video_brief:
  output: "course/lessons/L04/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Запустить слабый запрос.; Добавить роль, задачу, контекст и формат.; Сравнить результаты по конкретности и пригодности.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Әлсіз сұрауды орындау.; Рөл, тапсырма, контекст және формат қосу.; Нәтижелерді нақтылық пен жарамдылық бойынша салыстыру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L04/prompts.md"
    - "course/lessons/L04/assignment.md"
  prompt_ids:
    - "P-L04-01"
    - "P-L04-02"
  assignment_id: "A-L04-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Пара «до/после» с разметкой четырёх частей и двумя результатами. Шаги: Запустить слабый запрос.; Добавить роль, задачу, контекст и формат.; Сравнить результаты по конкретности и пригодности.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Төрт бөлігі белгіленген «бұрын/кейін» жұбы және екі нәтиже. Қадамдар: Әлсіз сұрауды орындау.; Рөл, тапсырма, контекст және формат қосу.; Нәтижелерді нақтылық пен жарамдылық бойынша салыстыру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Все четыре части отмечены."
      kk: "Төрт бөлік те белгіленген."
    - ru: "Улучшение наблюдаемо."
      kk: "Жақсару байқалады."
    - ru: "Исходная учебная цель не изменилась."
      kk: "Бастапқы оқу мақсаты өзгермеген."
assessment_brief:
  outputs:
    - "course/lessons/L04/quiz.yaml"
    - "course/lessons/L04/qa-report.md"
  question_ids:
    - "Q-L04-01"
    - "Q-L04-02"
    - "Q-L04-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Все четыре части отмечены.; Улучшение наблюдаемо.; Исходная учебная цель не изменилась.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Төрт бөлік те белгіленген.; Жақсару байқалады.; Бастапқы оқу мақсаты өзгермеген.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Все четыре части отмечены."
      kk: "Төрт бөлік те белгіленген."
    - ru: "Улучшение наблюдаемо."
      kk: "Жақсару байқалады."
    - ru: "Исходная учебная цель не изменилась."
      kk: "Бастапқы оқу мақсаты өзгермеген."
  mandatory_qa:
    - "RU/KK semantic parity"
    - "stable IDs"
    - "attachment opens"
    - "no student personal data"
    - "facts and answer keys checked"
    - "UI verified or dual markers retained"
    - "accessibility checked"
    - "QA PASS only"
