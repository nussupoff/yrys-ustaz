topic_ru: "Почему помощник не понимает: Р-З-К-Ф"
topic_kk: "Көмекші неге түсінбейді: Р-Т-К-Ф"
objective_ru: "Преобразовать расплывчатый запрос по каркасу «роль — задача — контекст — формат» и показать улучшение до и после."
objective_kk: "Көмескі сұрауды «рөл — тапсырма — контекст — формат» қаңқасымен өзгертіп, бұрынғы және кейінгі нәтижені көрсету."
outcomes_ru:
  - "Находит недостающие части запроса."
  - "Создаёт копируемый запрос из четырёх частей."
outcomes_kk:
  - "Сұраудағы жетіспейтін бөліктерді табады."
  - "Төрт бөліктен тұратын көшірілетін сұрау жасайды."
