teacher_artifact:
  ru: "Работающий тренажёр минимум с пятью заданиями."
  kk: "Кемінде бес тапсырмасы бар жұмыс істейтін жаттықтырғыш."
writer_brief:
  output: "course/lessons/L34/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: тренажёр, попытка, валидация, обратная связь, сброс. Маршрут: Подготовить проверенный банк заданий.; Реализовать цикл ответа и обратной связи.; Проверить повтор, сброс и граничные случаи.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: жаттықтырғыш, әрекет, валидация, кері байланыс, қайта бастау. Бағыт: Тексерілген тапсырмалар банкін дайындау.; Жауап пен кері байланыс циклін іске асыру.; Қайталауды, қайта бастауды және шектік жағдайларды тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Минимум пять заданий."
      kk: "Кемінде бес тапсырма."
    - ru: "Каждая попытка даёт корректную обратную связь."
      kk: "Әр әрекет дұрыс кері байланыс береді."
    - ru: "Можно безопасно начать заново."
      kk: "Қауіпсіз қайта бастауға болады."
video_brief:
  output: "course/lessons/L34/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Подготовить проверенный банк заданий.; Реализовать цикл ответа и обратной связи.; Проверить повтор, сброс и граничные случаи.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Тексерілген тапсырмалар банкін дайындау.; Жауап пен кері байланыс циклін іске асыру.; Қайталауды, қайта бастауды және шектік жағдайларды тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L34/prompts.md"
    - "course/lessons/L34/assignment.md"
  prompt_ids:
    - "P-L34-01"
    - "P-L34-02"
  assignment_id: "A-L34-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Работающий тренажёр минимум с пятью заданиями. Шаги: Подготовить проверенный банк заданий.; Реализовать цикл ответа и обратной связи.; Проверить повтор, сброс и граничные случаи.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Кемінде бес тапсырмасы бар жұмыс істейтін жаттықтырғыш. Қадамдар: Тексерілген тапсырмалар банкін дайындау.; Жауап пен кері байланыс циклін іске асыру.; Қайталауды, қайта бастауды және шектік жағдайларды тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Минимум пять заданий."
      kk: "Кемінде бес тапсырма."
    - ru: "Каждая попытка даёт корректную обратную связь."
      kk: "Әр әрекет дұрыс кері байланыс береді."
    - ru: "Можно безопасно начать заново."
      kk: "Қауіпсіз қайта бастауға болады."
assessment_brief:
  outputs:
    - "course/lessons/L34/quiz.yaml"
    - "course/lessons/L34/qa-report.md"
  question_ids:
    - "Q-L34-01"
    - "Q-L34-02"
    - "Q-L34-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Минимум пять заданий.; Каждая попытка даёт корректную обратную связь.; Можно безопасно начать заново.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Кемінде бес тапсырма.; Әр әрекет дұрыс кері байланыс береді.; Қауіпсіз қайта бастауға болады.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Минимум пять заданий."
      kk: "Кемінде бес тапсырма."
    - ru: "Каждая попытка даёт корректную обратную связь."
      kk: "Әр әрекет дұрыс кері байланыс береді."
    - ru: "Можно безопасно начать заново."
      kk: "Қауіпсіз қайта бастауға болады."
