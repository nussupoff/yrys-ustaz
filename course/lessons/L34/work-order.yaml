topic_ru: "Интерактивный тренажёр"
topic_kk: "Интерактивті жаттықтырғыш"
objective_ru: "Создать тренажёр с циклом «попытка → ответ → объясняющая обратная связь → следующая попытка»."
objective_kk: "«Әрекет → жауап → түсіндіретін кері байланыс → келесі әрекет» циклі бар жаттықтырғыш жасау."
outcomes_ru:
  - "Проектирует повторяемый учебный цикл."
  - "Тестирует правильные, неправильные и граничные ответы."
outcomes_kk:
  - "Қайталанатын оқу циклін жобалайды."
  - "Дұрыс, қате және шектік жауаптарды тексереді."
