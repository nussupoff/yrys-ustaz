teacher_artifact:
  ru: "Файл КТП/КТЖ минимум на один учебный период."
  kk: "Кемінде бір оқу кезеңіне арналған КТЖ файлы."
writer_brief:
  output: "course/lessons/L08/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: КТП, КТЖ, период, последовательность, контрольная точка. Маршрут: Задать количество часов и обязательные темы.; Распределить темы и результаты по периодам.; Проверить часы, зависимости и резерв.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: КТЖ, оқу кезеңі, реттілік, бақылау нүктесі, уақыт резерві. Бағыт: Сағат санын және міндетті тақырыптарды беру.; Тақырыптар мен нәтижелерді кезеңдерге бөлу.; Сағаттарды, тәуелділіктерді және резервті тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Часы не превышены."
      kk: "Сағат саны аспаған."
    - ru: "Предшествующие знания учтены."
      kk: "Алдыңғы білім ескерілген."
    - ru: "Контрольные точки распределены реалистично."
      kk: "Бақылау нүктелері шынайы бөлінген."
video_brief:
  output: "course/lessons/L08/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Задать количество часов и обязательные темы.; Распределить темы и результаты по периодам.; Проверить часы, зависимости и резерв.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Сағат санын және міндетті тақырыптарды беру.; Тақырыптар мен нәтижелерді кезеңдерге бөлу.; Сағаттарды, тәуелділіктерді және резервті тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L08/prompts.md"
    - "course/lessons/L08/assignment.md"
  prompt_ids:
    - "P-L08-01"
    - "P-L08-02"
  assignment_id: "A-L08-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Файл КТП/КТЖ минимум на один учебный период. Шаги: Задать количество часов и обязательные темы.; Распределить темы и результаты по периодам.; Проверить часы, зависимости и резерв.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Кемінде бір оқу кезеңіне арналған КТЖ файлы. Қадамдар: Сағат санын және міндетті тақырыптарды беру.; Тақырыптар мен нәтижелерді кезеңдерге бөлу.; Сағаттарды, тәуелділіктерді және резервті тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
