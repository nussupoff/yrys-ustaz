    - "course/lessons/L08/qa-report.md"
  question_ids:
    - "Q-L08-01"
    - "Q-L08-02"
    - "Q-L08-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Часы не превышены.; Предшествующие знания учтены.; Контрольные точки распределены реалистично.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Сағат саны аспаған.; Алдыңғы білім ескерілген.; Бақылау нүктелері шынайы бөлінген.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Часы не превышены."
      kk: "Сағат саны аспаған."
    - ru: "Предшествующие знания учтены."
