topic_ru: "Сайт класса"
topic_kk: "Сынып сайты"
objective_ru: "Создать безопасный сайт класса с понятной навигацией и без персональных данных учеников."
objective_kk: "Түсінікті навигациясы бар және оқушылардың дербес деректерін қамтымайтын қауіпсіз сынып сайтын жасау."
outcomes_ru:
  - "Проектирует главную страницу и минимум два раздела."
  - "Проверяет ссылки, мобильное чтение и публичные данные."
outcomes_kk:
  - "Басты бет пен кемінде екі бөлімді жобалайды."
  - "Сілтемелерді, мобильді оқылымды және ашық деректерді тексереді."
