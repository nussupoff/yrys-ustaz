    - "бейімделгіштік"
teacher_artifact:
  ru: "Рабочая ссылка на сайт класса и скрин главной страницы."
  kk: "Сынып сайтының жұмыс істейтін сілтемесі және басты бет скрині."
writer_brief:
  output: "course/lessons/L32/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: сайт, навигация, страница, публичный доступ, адаптивность. Маршрут: Определить публичную аудиторию.; Создать главную страницу и разделы.; Проверить навигацию и содержание в приватном окне.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: сайт, навигация, бет, ашық қолжетімділік, бейімделгіштік. Бағыт: Ашық аудиторияны анықтау.; Басты бет пен бөлімдерді жасау.; Навигация мен мазмұнды жеке терезеде тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Нет персональных данных."
      kk: "Дербес дерек жоқ."
    - ru: "Все основные ссылки работают."
      kk: "Негізгі сілтемелердің бәрі жұмыс істейді."
    - ru: "Пользователь понимает назначение сайта."
      kk: "Пайдаланушы сайт мақсатын түсінеді."
video_brief:
  output: "course/lessons/L32/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Определить публичную аудиторию.; Создать главную страницу и разделы.; Проверить навигацию и содержание в приватном окне.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Ашық аудиторияны анықтау.; Басты бет пен бөлімдерді жасау.; Навигация мен мазмұнды жеке терезеде тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L32/prompts.md"
    - "course/lessons/L32/assignment.md"
  prompt_ids:
    - "P-L32-01"
    - "P-L32-02"
  assignment_id: "A-L32-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Рабочая ссылка на сайт класса и скрин главной страницы. Шаги: Определить публичную аудиторию.; Создать главную страницу и разделы.; Проверить навигацию и содержание в приватном окне.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Сынып сайтының жұмыс істейтін сілтемесі және басты бет скрині. Қадамдар: Ашық аудиторияны анықтау.; Басты бет пен бөлімдерді жасау.; Навигация мен мазмұнды жеке терезеде тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Нет персональных данных."
      kk: "Дербес дерек жоқ."
    - ru: "Все основные ссылки работают."
      kk: "Негізгі сілтемелердің бәрі жұмыс істейді."
    - ru: "Пользователь понимает назначение сайта."
      kk: "Пайдаланушы сайт мақсатын түсінеді."
assessment_brief:
  outputs:
    - "course/lessons/L32/quiz.yaml"
    - "course/lessons/L32/qa-report.md"
  question_ids:
    - "Q-L32-01"
    - "Q-L32-02"
    - "Q-L32-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Нет персональных данных.; Все основные ссылки работают.; Пользователь понимает назначение сайта.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Дербес дерек жоқ.; Негізгі сілтемелердің бәрі жұмыс істейді.; Пайдаланушы сайт мақсатын түсінеді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Нет персональных данных."
      kk: "Дербес дерек жоқ."
    - ru: "Все основные ссылки работают."
      kk: "Негізгі сілтемелердің бәрі жұмыс істейді."
    - ru: "Пользователь понимает назначение сайта."
      kk: "Пайдаланушы сайт мақсатын түсінеді."
  mandatory_qa:
