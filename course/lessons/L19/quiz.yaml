            - "интернет әлсіз"
            - "жұптық жұмыс"
            - "баспа нұсқасы қажет"
      artifact_binding_ru: "Подставить тему и ограничения участника; при наличии запросить фрагмент его работы «проверенная карточка с правками» и ссылаться на конкретное доказательство."
      artifact_binding_kk: "Қатысушының тақырыбы мен шектеулерін қою; бар болса, оның «түзетулері бар тексерілген карточка» жұмысынан үзінді сұрап, нақты дәлелге сілтеу."
  - id: "Q-L19-02"
    lesson_id: "L19"
    track: "visuals"
    type: "error_detection"
    difficulty: "medium"
    learning_goal_ru: "Обнаружить критическую ошибку в артефакте «проверенная карточка с правками» и выбрать исправление."
    learning_goal_kk: "«түзетулері бар тексерілген карточка» артефактісіндегі маңызды қатені анықтап, түзетуді таңдау."
    prompt_ru: "В приложенном артефакте «проверенная карточка с правками» обнаружено: исправлена орфография, но сохранён неверный ответ в ключе. Что нужно сделать в первую очередь?"
    prompt_kk: "Тіркелген «түзетулері бар тексерілген карточка» артефактісінде мына мәселе анықталды: емле түзетілген, бірақ кілттегі қате жауап сақталған. Ең алдымен не істеу керек?"
    options_ru:
      - "Сохранить версию как есть: визуальная привлекательность важнее."
      - "Добавить декоративный элемент, не меняя содержание."
      - "Исправить указанную ошибку, повторно проверить, что проверка охватывает содержание, язык, доступность и ключ ответа, и приложить версию до/после или иной проверяемый след."
      - "Удалить критерии проверки, чтобы ошибка не влияла на оценивание."
    options_kk:
      - "Нұсқаны өзгеріссіз сақтау: көрнекі тартымдылық маңыздырақ."
      - "Мазмұнды өзгертпей сәндік элемент қосу."
      - "Көрсетілген қатені түзетіп, тексеру мазмұнды, тілді, қолжетімділікті және жауап кілтін қамтиды екенін қайта тексеру және дейін/кейін нұсқасын не басқа тексерілетін дәлелді тіркеу."
      - "Қате бағалауға әсер етпеуі үшін тексеру критерийлерін жою."
    correct_answer: "C"
    rationale_ru: "Сначала устраняется ошибка, влияющая на учебный результат или безопасность. Повторная проверка и доказательство изменения позволяют подтвердить выполнение."
    rationale_kk: "Алдымен оқу нәтижесіне немесе қауіпсіздікке әсер ететін қате түзетіледі. Қайта тексеру және өзгеріс дәлелі орындалуды растауға мүмкіндік береді."
    randomization:
      shuffle_options: true
