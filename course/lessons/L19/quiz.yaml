        - "нәтиже көрсетілген аудиторияға сәйкес емес"
  - id: "Q-L19-04"
    lesson_id: "L19"
    track: "visuals"
    type: "artifact_analysis"
    difficulty: "medium"
    learning_goal_ru: "Проанализировать собственный артефакт «проверенная карточка с правками» по доказательствам."
    learning_goal_kk: "Өзінің «түзетулері бар тексерілген карточка» артефактісін дәлелдер бойынша талдау."
    prompt_ru: "Приложите или откройте собственный артефакт «проверенная карточка с правками». Укажите два конкретных фрагмента, подтверждающих, что проверка охватывает содержание, язык, доступность и ключ ответа. Затем назовите одно улучшение, внесите его и приложите доказательство до/после. Если артефакт — видео или сайт, используйте таймкод, URL и описание шага воспроизведения."
    prompt_kk: "Өзіңіздің «түзетулері бар тексерілген карточка» артефактіңізді тіркеңіз немесе ашыңыз. тексеру мазмұнды, тілді, қолжетімділікті және жауап кілтін қамтиды екенін растайтын екі нақты үзіндіні көрсетіңіз. Содан кейін бір жақсартуды атап, оны енгізіп, дейін/кейін дәлелін тіркеңіз. Артефакт бейне не сайт болса, таймкодты, URL-ді және қайта орындау қадамын қолданыңыз."
    rubric_ru:
      - "0–2: представлены два конкретных доказательства из собственной работы, а не общие утверждения."
      - "0–2: доказательства действительно подтверждают критерий: проверка охватывает содержание, язык, доступность и ключ ответа."
      - "0–2: предложенное улучшение связано с обнаруженной проблемой."
      - "0–2: приложено проверяемое доказательство изменения — до/после, таймкод, URL, скриншот или журнал теста."
      - "0–2: объяснение не содержит персональных данных учеников и позволяет повторить проверку."
    rubric_kk:
      - "0–2: жалпы тұжырым емес, өз жұмысынан екі нақты дәлел берілген."
      - "0–2: дәлелдер мына критерийді шынымен растайды: тексеру мазмұнды, тілді, қолжетімділікті және жауап кілтін қамтиды."
      - "0–2: ұсынылған жақсарту анықталған мәселемен байланысты."
      - "0–2: өзгерістің тексерілетін дәлелі тіркелген — дейін/кейін, таймкод, URL, скриншот немесе тест журналы."
      - "0–2: түсіндірмеде оқушының дербес деректері жоқ және тексеруді қайталауға болады."
    rationale_ru: "Задание требует анализа персонального результата, объяснения выбора и доказательства исправления. Это снижает ценность простого копирования ответа, но не заявляет полной AI-proof защиты."
    rationale_kk: "Тапсырма жеке нәтижені талдауды, таңдауды түсіндіруді және түзету дәлелін талап етеді. Бұл дайын жауапты көшірудің пайдасын азайтады, бірақ толық AI-proof қорғанысын мәлімдемейді."
