      kk: "Мәтіннің әр жолы тексерілген."
    - ru: "Числа и подписи точны."
      kk: "Сандар мен жазбалар дәл."
    - ru: "Указан использованный источник."
      kk: "Қолданылған дереккөз көрсетілген."
assessment_brief:
  outputs:
    - "course/lessons/L19/quiz.yaml"
    - "course/lessons/L19/qa-report.md"
  question_ids:
    - "Q-L19-01"
    - "Q-L19-02"
    - "Q-L19-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Каждая строка текста проверена.; Числа и подписи точны.; Указан использованный источник.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Мәтіннің әр жолы тексерілген.; Сандар мен жазбалар дәл.; Қолданылған дереккөз көрсетілген.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Каждая строка текста проверена."
      kk: "Мәтіннің әр жолы тексерілген."
