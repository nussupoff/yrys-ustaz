topic_ru: "Проверенная учебная карточка"
topic_kk: "Тексерілген оқу карточкасы"
objective_ru: "Создать учебную карточку и вручную сверить весь текст, числа, символы и визуальные связи."
objective_kk: "Оқу карточкасын жасап, барлық мәтінді, сандарды, таңбаларды және визуалдық байланыстарды қолмен тексеру."
outcomes_ru:
  - "Исправляет сгенерированные текстовые и предметные ошибки."
  - "Фиксирует источник и лист ручной проверки."
outcomes_kk:
  - "Генерацияланған мәтіндік және пәндік қателерді түзетеді."
  - "Дереккөз бен қолмен тексеру парағын тіркейді."
prerequisites:
  - "L15"
  - "L18"
technical_concepts:
  ru:
    - "ручная верификация"
    - "OCR-ошибка"
    - "учебная точность"
    - "контрольная версия"
  kk:
    - "қолмен тексеру"
    - "OCR қатесі"
    - "оқу дәлдігі"
    - "бақылау нұсқасы"
teacher_artifact:
  ru: "Финальная карточка и заполненный чек-лист ручной сверки."
  kk: "Соңғы карточка және толтырылған қолмен салыстыру чек-парағы."
writer_brief:
  output: "course/lessons/L19/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: ручная верификация, OCR-ошибка, учебная точность, контрольная версия. Маршрут: Создать черновик карточки.; Сверить текст и содержание по источнику.; Исправить ошибки и сохранить финальную версию.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: қолмен тексеру, OCR қатесі, оқу дәлдігі, бақылау нұсқасы. Бағыт: Карточка жобасын жасау.; Мәтін мен мазмұнды дереккөзбен салыстыру.; Қателерді түзетіп, соңғы нұсқаны сақтау.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Каждая строка текста проверена."
      kk: "Мәтіннің әр жолы тексерілген."
    - ru: "Числа и подписи точны."
      kk: "Сандар мен жазбалар дәл."
    - ru: "Указан использованный источник."
      kk: "Қолданылған дереккөз көрсетілген."
video_brief:
  output: "course/lessons/L19/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Создать черновик карточки.; Сверить текст и содержание по источнику.; Исправить ошибки и сохранить финальную версию.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Карточка жобасын жасау.; Мәтін мен мазмұнды дереккөзбен салыстыру.; Қателерді түзетіп, соңғы нұсқаны сақтау.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L19/prompts.md"
    - "course/lessons/L19/assignment.md"
  prompt_ids:
    - "P-L19-01"
    - "P-L19-02"
  assignment_id: "A-L19-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Финальная карточка и заполненный чек-лист ручной сверки. Шаги: Создать черновик карточки.; Сверить текст и содержание по источнику.; Исправить ошибки и сохранить финальную версию.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Соңғы карточка және толтырылған қолмен салыстыру чек-парағы. Қадамдар: Карточка жобасын жасау.; Мәтін мен мазмұнды дереккөзбен салыстыру.; Қателерді түзетіп, соңғы нұсқаны сақтау.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
