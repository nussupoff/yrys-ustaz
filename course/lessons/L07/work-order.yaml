  prompt_ids:
    - "P-L07-01"
    - "P-L07-02"
  assignment_id: "A-L07-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Файл конспекта с целями, таблицей этапов и оцениванием. Шаги: Заполнить предмет, класс, длительность и цель.; Составить этапы с действиями учителя и учеников.; Добавить проверку достижения цели.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Мақсаттары, кезеңдер кестесі және бағалауы бар конспект файлы. Қадамдар: Пәнді, сыныпты, ұзақтықты және мақсатты толтыру.; Мұғалім мен оқушы әрекеттері бар кезеңдер құру.; Мақсатқа жетуді тексеруді қосу.."
  required_prompt_placeholders:
