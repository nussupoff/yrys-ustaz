    - "Q-L07-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Цель наблюдаема.; Тайминг сходится.; Оценивание проверяет заявленную цель.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Мақсат бақыланады.; Уақыт есебі сәйкес.; Бағалау мәлімделген мақсатты тексереді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
