teacher_artifact:
  ru: "Файл конспекта с целями, таблицей этапов и оцениванием."
  kk: "Мақсаттары, кезеңдер кестесі және бағалауы бар конспект файлы."
writer_brief:
  output: "course/lessons/L07/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: цель обучения, этап урока, тайминг, формативное оценивание. Маршрут: Заполнить предмет, класс, длительность и цель.; Составить этапы с действиями учителя и учеников.; Добавить проверку достижения цели.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: оқу мақсаты, сабақ кезеңі, тайминг, қалыптастырушы бағалау. Бағыт: Пәнді, сыныпты, ұзақтықты және мақсатты толтыру.; Мұғалім мен оқушы әрекеттері бар кезеңдер құру.; Мақсатқа жетуді тексеруді қосу.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Цель наблюдаема."
      kk: "Мақсат бақыланады."
    - ru: "Тайминг сходится."
      kk: "Уақыт есебі сәйкес."
    - ru: "Оценивание проверяет заявленную цель."
      kk: "Бағалау мәлімделген мақсатты тексереді."
video_brief:
  output: "course/lessons/L07/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Заполнить предмет, класс, длительность и цель.; Составить этапы с действиями учителя и учеников.; Добавить проверку достижения цели.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Пәнді, сыныпты, ұзақтықты және мақсатты толтыру.; Мұғалім мен оқушы әрекеттері бар кезеңдер құру.; Мақсатқа жетуді тексеруді қосу.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
