  method_ru: "Мини-тест используется только там, где короткие задания дают валидное доказательство понимания действия."
  method_kk: "Шағын тест қысқа тапсырмалар әрекетті түсінудің жарамды дәлелін бергенде ғана қолданылады."
reason_ru: "Итог навыка проверяется запуском персонального приложения, тест-кейсами, журналом ошибок и доказательством исправлений."
reason_kk: "Дағды нәтижесі жеке қолданбаны іске қосу, тест-кейстер, қателер журналы және түзету дәлелі арқылы тексеріледі."
alternative_evidence_ru: "Проверить приложенный артефакт «работающее мини-приложение» по рубрике итогового вопроса Q-L36-04."
