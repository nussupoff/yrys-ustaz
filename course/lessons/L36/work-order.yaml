topic_kk: "Оқу міндетіне арналған шағын қолданба"
objective_ru: "Создать мини-приложение с проверяемым сценарием «входные данные → действие → результат» и прозрачным описанием роли ИИ."
objective_kk: "«Кіріс деректері → әрекет → нәтиже» тексерілетін сценарийі және ЖИ рөлінің ашық сипаттамасы бар шағын қолданба жасау."
outcomes_ru:
  - "Ограничивает приложение одной ясной задачей."
  - "Проверяет нормальный, пустой и ошибочный ввод."
outcomes_kk:
  - "Қолданбаны бір анық міндетпен шектейді."
  - "Қалыпты, бос және қате енгізуді тексереді."
