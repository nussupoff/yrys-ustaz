teacher_artifact:
  ru: "Рабочее мини-приложение, ссылка и короткий протокол тестирования."
  kk: "Жұмыс істейтін шағын қолданба, сілтеме және қысқа тестілеу хаттамасы."
writer_brief:
  output: "course/lessons/L36/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: мини-приложение, ввод, валидация, результат, раскрытие роли ИИ. Маршрут: Сформулировать одно действие пользователя.; Создать форму ввода и наблюдаемый результат.; Протестировать три типа ввода и раскрытие роли ИИ.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: шағын қолданба, енгізу, валидация, нәтиже, ЖИ рөлін ашу. Бағыт: Пайдаланушының бір әрекетін тұжырымдау.; Енгізу формасы мен бақыланатын нәтиже жасау.; Енгізудің үш түрін және ЖИ рөлінің ашықтығын тексеру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Вход, действие и результат воспроизводимы."
      kk: "Кіріс, әрекет және нәтиже қайталанады."
    - ru: "Пустой и ошибочный ввод обработаны."
      kk: "Бос және қате енгізу өңделген."
    - ru: "Ограничения и роль ИИ видимы пользователю."
      kk: "Шектеулер мен ЖИ рөлі пайдаланушыға көрінеді."
video_brief:
  output: "course/lessons/L36/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Сформулировать одно действие пользователя.; Создать форму ввода и наблюдаемый результат.; Протестировать три типа ввода и раскрытие роли ИИ.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Пайдаланушының бір әрекетін тұжырымдау.; Енгізу формасы мен бақыланатын нәтиже жасау.; Енгізудің үш түрін және ЖИ рөлінің ашықтығын тексеру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L36/prompts.md"
    - "course/lessons/L36/assignment.md"
  prompt_ids:
    - "P-L36-01"
    - "P-L36-02"
  assignment_id: "A-L36-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Рабочее мини-приложение, ссылка и короткий протокол тестирования. Шаги: Сформулировать одно действие пользователя.; Создать форму ввода и наблюдаемый результат.; Протестировать три типа ввода и раскрытие роли ИИ.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Жұмыс істейтін шағын қолданба, сілтеме және қысқа тестілеу хаттамасы. Қадамдар: Пайдаланушының бір әрекетін тұжырымдау.; Енгізу формасы мен бақыланатын нәтиже жасау.; Енгізудің үш түрін және ЖИ рөлінің ашықтығын тексеру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Вход, действие и результат воспроизводимы."
      kk: "Кіріс, әрекет және нәтиже қайталанады."
    - ru: "Пустой и ошибочный ввод обработаны."
      kk: "Бос және қате енгізу өңделген."
    - ru: "Ограничения и роль ИИ видимы пользователю."
      kk: "Шектеулер мен ЖИ рөлі пайдаланушыға көрінеді."
assessment_brief:
  outputs:
    - "course/lessons/L36/quiz.yaml"
    - "course/lessons/L36/qa-report.md"
  question_ids:
    - "Q-L36-01"
    - "Q-L36-02"
    - "Q-L36-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Вход, действие и результат воспроизводимы.; Пустой и ошибочный ввод обработаны.; Ограничения и роль ИИ видимы пользователю.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Кіріс, әрекет және нәтиже қайталанады.; Бос және қате енгізу өңделген.; Шектеулер мен ЖИ рөлі пайдаланушыға көрінеді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Вход, действие и результат воспроизводимы."
      kk: "Кіріс, әрекет және нәтиже қайталанады."
    - ru: "Пустой и ошибочный ввод обработаны."
      kk: "Бос және қате енгізу өңделген."
    - ru: "Ограничения и роль ИИ видимы пользователю."
      kk: "Шектеулер мен ЖИ рөлі пайдаланушыға көрінеді."
  mandatory_qa:
    - "RU/KK semantic parity"
    - "stable IDs"
    - "attachment opens"
    - "no student personal data"
    - "facts and answer keys checked"
    - "UI verified or dual markers retained"
    - "accessibility checked"
    - "QA PASS only"
attachment_type:
