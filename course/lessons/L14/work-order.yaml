topic_ru: "Учебная иллюстрация"
topic_kk: "Оқу иллюстрациясы"
objective_ru: "Создать одну визуально точную иллюстрацию, которая помогает объяснить конкретное учебное понятие."
objective_kk: "Белгілі бір оқу ұғымын түсіндіруге көмектесетін бір визуалдық дәл иллюстрация жасау."
outcomes_ru:
  - "Переводит учебную цель в визуальные требования."
  - "Проверяет изображение на фактические и композиционные ошибки."
outcomes_kk:
  - "Оқу мақсатын визуалдық талаптарға айналдырады."
  - "Суреттегі фактілік және композициялық қателерді тексереді."
