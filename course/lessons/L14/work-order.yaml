      kk: "Иллюстрация мақсатты қолдайды."
    - ru: "Нет лишних или неверных деталей."
      kk: "Артық немесе қате бөлшек жоқ."
    - ru: "Подпись объясняет способ использования."
      kk: "Жазба қолдану тәсілін түсіндіреді."
assessment_brief:
  outputs:
    - "course/lessons/L14/quiz.yaml"
    - "course/lessons/L14/qa-report.md"
  question_ids:
    - "Q-L14-01"
    - "Q-L14-02"
    - "Q-L14-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Иллюстрация поддерживает цель.; Нет лишних или неверных деталей.; Подпись объясняет способ использования.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Иллюстрация мақсатты қолдайды.; Артық немесе қате бөлшек жоқ.; Жазба қолдану тәсілін түсіндіреді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Иллюстрация поддерживает цель."
      kk: "Иллюстрация мақсатты қолдайды."
    - ru: "Нет лишних или неверных деталей."
      kk: "Артық немесе қате бөлшек жоқ."
    - ru: "Подпись объясняет способ использования."
      kk: "Жазба қолдану тәсілін түсіндіреді."
  mandatory_qa:
