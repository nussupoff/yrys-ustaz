    - "кадр қатынасы"
teacher_artifact:
  ru: "Одна учебная иллюстрация и подпись с её назначением."
  kk: "Бір оқу иллюстрациясы және оның мақсатын түсіндіретін жазба."
writer_brief:
  output: "course/lessons/L14/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: визуальный промпт, композиция, референс, соотношение сторон. Маршрут: Сформулировать одно понятие и одну функцию изображения.; Описать объекты, связи, ракурс и ограничения.; Сверить визуальные детали с источником.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: визуалдық промпт, композиция, референс, кадр қатынасы. Бағыт: Бір ұғым мен суреттің бір қызметін тұжырымдау.; Нысандарды, байланыстарды, ракурсты және шектеулерді сипаттау.; Визуалдық бөлшектерді дереккөзбен салыстыру.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Иллюстрация поддерживает цель."
      kk: "Иллюстрация мақсатты қолдайды."
    - ru: "Нет лишних или неверных деталей."
      kk: "Артық немесе қате бөлшек жоқ."
    - ru: "Подпись объясняет способ использования."
      kk: "Жазба қолдану тәсілін түсіндіреді."
video_brief:
  output: "course/lessons/L14/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Сформулировать одно понятие и одну функцию изображения.; Описать объекты, связи, ракурс и ограничения.; Сверить визуальные детали с источником.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Бір ұғым мен суреттің бір қызметін тұжырымдау.; Нысандарды, байланыстарды, ракурсты және шектеулерді сипаттау.; Визуалдық бөлшектерді дереккөзбен салыстыру.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L14/prompts.md"
    - "course/lessons/L14/assignment.md"
  prompt_ids:
    - "P-L14-01"
    - "P-L14-02"
  assignment_id: "A-L14-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Одна учебная иллюстрация и подпись с её назначением. Шаги: Сформулировать одно понятие и одну функцию изображения.; Описать объекты, связи, ракурс и ограничения.; Сверить визуальные детали с источником.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Бір оқу иллюстрациясы және оның мақсатын түсіндіретін жазба. Қадамдар: Бір ұғым мен суреттің бір қызметін тұжырымдау.; Нысандарды, байланыстарды, ракурсты және шектеулерді сипаттау.; Визуалдық бөлшектерді дереккөзбен салыстыру.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
