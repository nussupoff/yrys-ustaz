topic_ru: "ОВЗ: раскраска и визуальная опора"
topic_kk: "ЕБҚ: бояу және визуалдық тірек"
objective_ru: "Создать два доступных материала — раскраску и визуальную опору — без указания диагноза ребёнка."
objective_kk: "Баланың диагнозын көрсетпей, қолжетімді екі материал — бояу парағы мен визуалдық тірек — жасау."
outcomes_ru:
  - "Упрощает визуальную нагрузку без обеднения цели."
  - "Предлагает материал как опцию, а не ярлык."
outcomes_kk:
  - "Мақсатты жұтаңдатпай визуалдық жүктемені азайтады."
  - "Материалды таңба емес, нұсқа ретінде ұсынады."
