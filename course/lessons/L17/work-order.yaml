teacher_artifact:
  ru: "Два материала: контурная раскраска и пошаговая визуальная опора."
  kk: "Екі материал: контурлық бояу парағы және қадамдық визуалдық тірек."
writer_brief:
  output: "course/lessons/L17/lesson.md"
  ru: "Написать пошаговый микроурок для начинающего учителя. Объяснить термины: доступность, визуальная опора, сенсорная нагрузка, альтернативный формат. Маршрут: Определить общую учебную цель.; Создать простой контурный материал.; Создать последовательную опору с крупными символами.. Добавить блоки «что получится», «типичные ошибки», «самопроверка», безопасность, фактчекинг и раскрытие роли ИИ. Не описывать непроверенные кнопки или режимы как существующие."
  kk: "Бастаушы мұғалімге арналған қадамдық микроcабақ жазу. Терминдерді түсіндіру: қолжетімділік, визуалдық тірек, сенсорлық жүктеме, балама формат. Бағыт: Ортақ оқу мақсатын анықтау.; Қарапайым контурлық материал жасау.; Ірі белгілері бар ретті тірек жасау.. «Не шығуы тиіс», «жиі қателер», «өзін-өзі тексеру», қауіпсіздік, фактчекинг және ЖИ рөлін ашу бөлімдерін қосу. Тексерілмеген батырма немесе режимді бар деп сипаттамау."
  acceptance:
    - ru: "Приложены два разных материала."
      kk: "Екі түрлі материал тіркелген."
    - ru: "Нет диагноза или ярлыка."
      kk: "Диагноз немесе таңба жоқ."
    - ru: "Контраст, пространство и инструкция доступны."
      kk: "Контраст, кеңістік және нұсқау қолжетімді."
video_brief:
  output: "course/lessons/L17/video-script.md"
  maximum_duration_seconds: 180
  target_duration_seconds: "120-180"
  ru: "Подготовить самостоятельный сценарий на 2–3 минуты: хук 0–15 секунд, демонстрация 15–135 секунд, мини-проверка и переход к практике 135–180 секунд. На экране последовательно показать: Определить общую учебную цель.; Создать простой контурный материал.; Создать последовательную опору с крупными символами.. Для каждого кадра дать таймкод, действие, дикторский текст и подпись. Интерфейс переснять перед выпуском."
  kk: "2–3 минуттық дербес сценарий дайындау: 0–15 секунд ілмек, 15–135 секунд көрсету, 135–180 секунд шағын тексеру және практикаға өту. Экранда ретімен көрсету: Ортақ оқу мақсатын анықтау.; Қарапайым контурлық материал жасау.; Ірі белгілері бар ретті тірек жасау.. Әр кадрға таймкод, әрекет, диктор мәтіні және экран жазуын беру. Шығарылым алдында интерфейсті қайта түсіру."
  visual_rules:
    ru: "Светлый минималистичный стиль, крупный контрастный текст; в сценах с людьми — женщины-учителя."
    kk: "Ашық минималистік стиль, ірі контраст мәтін; адам бар көріністерде — әйел мұғалімдер."
  ui_verification:
    ru: "Любое название кнопки, модели, режима, лимита или экспорта до проверки помечать [НУЖНА ПРОВЕРКА]."
    kk: "Батырма, модель, режим, лимит немесе экспорт атауын тексергенге дейін [ТЕКСЕРУ ҚАЖЕТ] деп белгілеу."
prompt_practice_brief:
  outputs:
    - "course/lessons/L17/prompts.md"
    - "course/lessons/L17/assignment.md"
  prompt_ids:
    - "P-L17-01"
    - "P-L17-02"
  assignment_id: "A-L17-01"
  ru: "Создать два копируемых двуязычных промпта: первый производит черновик артефакта, второй проводит критический аудит по критериям. Использовать Р-З-К-Ф, квадратные плейсхолдеры, синтетический пример, ограничения формата, запрет персональных данных и требование ручной проверки. Практика должна привести к результату: Два материала: контурная раскраска и пошаговая визуальная опора. Шаги: Определить общую учебную цель.; Создать простой контурный материал.; Создать последовательную опору с крупными символами.."
  kk: "Екі көшірілетін екітілді промпт жасау: біріншісі артефакт жобасын жасайды, екіншісі өлшемшарттар бойынша сыни аудит жүргізеді. Р-Т-К-Ф қаңқасын, шаршы жақшадағы толтырылатын орындарды, синтетикалық мысалды, формат шектеулерін, дербес дерекке тыйымды және қолмен тексеру талабын қолдану. Практика нәтижесі: Екі материал: контурлық бояу парағы және қадамдық визуалдық тірек. Қадамдар: Ортақ оқу мақсатын анықтау.; Қарапайым контурлық материал жасау.; Ірі белгілері бар ретті тірек жасау.."
  required_prompt_placeholders:
    ru:
      - "[ПРЕДМЕТ]"
      - "[КЛАСС]"
      - "[ЦЕЛЬ]"
      - "[ОГРАНИЧЕНИЯ]"
      - "[ФОРМАТ]"
    kk:
      - "[ПӘН]"
      - "[СЫНЫП]"
      - "[МАҚСАТ]"
      - "[ШЕКТЕУЛЕР]"
      - "[ФОРМАТ]"
  evidence_required:
    - ru: "Приложены два разных материала."
      kk: "Екі түрлі материал тіркелген."
    - ru: "Нет диагноза или ярлыка."
      kk: "Диагноз немесе таңба жоқ."
    - ru: "Контраст, пространство и инструкция доступны."
      kk: "Контраст, кеңістік және нұсқау қолжетімді."
assessment_brief:
  outputs:
    - "course/lessons/L17/quiz.yaml"
    - "course/lessons/L17/qa-report.md"
  question_ids:
    - "Q-L17-01"
    - "Q-L17-02"
    - "Q-L17-03"
  ru: "Создать три ситуационных вопроса с одним обоснованным ключом, объяснением и обратной связью. Вопросы проверяют применение, безопасность и оценку качества, а не запоминание интерфейса. Проверить вложение по критериям: Приложены два разных материала.; Нет диагноза или ярлыка.; Контраст, пространство и инструкция доступны.. QA выпускает урок только со статусом PASS; blockers передать владельцу."
  kk: "Бір негізделген кілті, түсіндірмесі және кері байланысы бар үш жағдаяттық сұрақ жасау. Сұрақтар интерфейсті жаттауды емес, қолдануды, қауіпсіздікті және сапаны бағалауды тексереді. Тіркемені мына өлшемшарттармен тексеру: Екі түрлі материал тіркелген.; Диагноз немесе таңба жоқ.; Контраст, кеңістік және нұсқау қолжетімді.. QA сабақты тек PASS мәртебесімен шығарады; блоктаушы ақауды иесіне береді."
  readiness_criteria:
    - ru: "Приложены два разных материала."
      kk: "Екі түрлі материал тіркелген."
    - ru: "Нет диагноза или ярлыка."
      kk: "Диагноз немесе таңба жоқ."
    - ru: "Контраст, пространство и инструкция доступны."
      kk: "Контраст, кеңістік және нұсқау қолжетімді."
